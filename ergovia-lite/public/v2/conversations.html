<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversations - Ergovia Prestige</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/logo.png" type="image/png">
    <script>
        (function() {
            const saved = localStorage.getItem('ergovia_theme');
            if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        .conversations-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
            height: calc(100vh - 70px);
            overflow: hidden;
        }
        .conv-sidebar {
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .conv-sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .conv-sidebar-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        .conv-list {
            flex: 1;
            overflow-y: auto;
        }
        .conv-item {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }
        .conv-item:hover, .conv-item.active {
            background: var(--bg-elevated);
        }
        .conv-item.active {
            border-left: 3px solid #c9a84c;
        }
        .conv-item-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }
        .conv-messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            overflow: hidden;
        }
        .conv-messages-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .conv-messages-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        .conv-messages-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        .msg-bubble.human {
            align-self: flex-end;
            background: #c9a84c;
            color: #0f1922;
            border-bottom-right-radius: 4px;
        }
        .msg-bubble.ai {
            align-self: flex-start;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .msg-wrapper {
            display: flex;
            flex-direction: column;
        }
        .msg-wrapper.human { align-items: flex-end; }
        .msg-wrapper.ai { align-items: flex-start; }
        .conv-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            gap: 12px;
        }
        .conv-empty i { font-size: 48px; opacity: 0.3; }
        .conv-empty p { font-size: 14px; text-align: center; }
        .refresh-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
        }
        .refresh-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }
        .msg-count-badge {
            background: #c9a84c;
            color: #0f1922;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
        }
        .conv-search {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }
        .conv-search input {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }
        .conv-search input::placeholder { color: var(--text-secondary); }
        .conv-search input:focus { border-color: #c9a84c; }
        .conv-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: linear-gradient(135deg, #c9a84c, #a07830);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 700; color: #0f1922; flex-shrink: 0;
        }
        .conv-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            cursor: pointer; transition: background 0.15s;
        }
        .conv-item-body { flex: 1; min-width: 0; }
        /* Channel badge — light mode default */
        .channel-badge {
            font-size: 10px; padding: 1px 6px; border-radius: 10px;
            font-weight: 600; background: #e8f4ff; color: #1a56db;
        }
        [data-theme="dark"] .channel-badge {
            background: #1e4a7a; color: #90cdf4;
        }
        .msg-wrapper { display: flex; align-items: flex-start; gap: 8px; }
        .msg-wrapper.human { flex-direction: row-reverse; }
        .msg-inner { display: flex; flex-direction: column; }
        .msg-inner.human { align-items: flex-end; }
        .msg-inner.ai { align-items: flex-start; }
        .msg-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; flex-shrink: 0; margin-top: 2px;
        }
        /* Message avatars — light mode default */
        .msg-avatar.ai { background: #d1e8ff; color: #1a56db; }
        .msg-avatar.human { background: #fef3c7; color: #92400e; }
        [data-theme="dark"] .msg-avatar.ai { background: #1e4a7a; color: #90cdf4; }
        [data-theme="dark"] .msg-avatar.human { background: #744210; color: #f6e05e; }
        .msg-bubble.human { border-bottom-right-radius: 4px; border-bottom-left-radius: 12px; }
        .msg-bubble.ai { border-bottom-left-radius: 4px; border-bottom-right-radius: 12px; }

        /* Theme-aware utility classes (used in JS-rendered HTML) */
        .muted-text { color: var(--text-secondary); }
        .error-text { color: #c53030; }
        [data-theme="dark"] .error-text { color: #fc8181; }
        .session-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: auto;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="/logo.png" alt="Ergovia" style="width:28px;height:auto;margin-right:4px;">
                <span>Ergovia</span>
            </div>
            <div class="nav-menu">
                <a href="dashboard" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="settings" class="nav-item">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Settings</span>
                </a>
                <a href="properties" class="nav-item">
                    <i class="fas fa-building"></i>
                    <span>Properties</span>
                </a>
                <a href="conversations" class="nav-item active">
                    <i class="fas fa-comments"></i>
                    <span>Conversations</span>
                </a>
                <a href="calendar" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Calendar</span>
                </a>
            </div>
            <div class="nav-user">
                <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="notification-bell" id="notificationBell">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notificationCount">0</span>
                </div>
                <div class="user-profile" id="userProfileBtn">
                    <i class="fas fa-user-circle"></i>
                    <span id="userName">Owner</span>
                    <i class="fas fa-chevron-down" style="font-size:11px;color:var(--text-secondary);"></i>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="user-dropdown-header">
                            <h4 id="dropdownUserName">Owner</h4>
                            <p id="dropdownUserEmail">owner@ergovia.com</p>
                        </div>
                        <a class="user-dropdown-item" href="settings"><i class="fas fa-cog"></i> Account Settings</a>
                        <div class="user-dropdown-divider"></div>
                        <button class="user-dropdown-item danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Log Out</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conversations Layout -->
    <div class="conversations-layout">
        <!-- Left sidebar: conversation list -->
        <div class="conv-sidebar">
            <div class="conv-sidebar-header">
                <h3><i class="fas fa-comments" style="color:#c9a84c;margin-right:8px;"></i>Conversations</h3>
                <button class="refresh-btn" id="refreshBtn" title="Refresh"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div class="conv-search">
                <input type="text" id="convSearch" placeholder="&#xf002;  Search conversations..." oninput="filterConvList(this.value)">
            </div>
            <div class="conv-list" id="convList">
                <div class="muted-text" style="padding:30px;text-align:center;font-size:13px;">
                    <i class="fas fa-spinner fa-spin" style="font-size:24px;margin-bottom:12px;display:block;"></i>
                    Loading conversations...
                </div>
            </div>
        </div>

        <!-- Right panel: message thread -->
        <div class="conv-messages" id="convMessages">
            <div class="conv-empty">
                <i class="fas fa-comments"></i>
                <p>Select a conversation to view messages<br><span style="font-size:11px;opacity:0.6;">Guest chats with the AI assistant will appear here</span></p>
            </div>
        </div>
    </div>

    <script>
        let activeSessionId = null;

        function authHeaders() {
            const token = localStorage.getItem('ergovia_token');
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        }

        async function loadConversations() {
            try {
                const resp = await fetch('/api/v2/conversations', { headers: authHeaders() });
                const data = await resp.json();
                renderConvList(data.conversations || []);
            } catch (err) {
                document.getElementById('convList').innerHTML =
                    '<div class="error-text" style="padding:20px;text-align:center;font-size:13px;">Failed to load conversations</div>';
            }
        }

        let allConversations = [];

        function getInitials(sessionId) {
            // Try to extract a readable name from session_id (e.g. "6573358279" → "65")
            const clean = sessionId.replace(/[^a-zA-Z0-9]/g, '');
            return clean.substring(0, 2).toUpperCase();
        }

        function getChannelFromId(sessionId) {
            if (/^\d{7,}$/.test(sessionId)) return 'Telegram';
            if (sessionId.startsWith('+')) return 'SMS';
            if (sessionId.includes('@')) return 'WhatsApp';
            return 'Guest';
        }

        function timeAgo(dateStr) {
            if (!dateStr) return '';
            const diff = Date.now() - new Date(dateStr).getTime();
            const m = Math.floor(diff / 60000);
            if (m < 1) return 'just now';
            if (m < 60) return `${m}m ago`;
            const h = Math.floor(m / 60);
            if (h < 24) return `${h}h ago`;
            return `${Math.floor(h / 24)}d ago`;
        }

        function renderConvList(conversations) {
            allConversations = conversations;
            renderFilteredList(conversations);
        }

        function renderFilteredList(conversations) {
            const list = document.getElementById('convList');
            if (!conversations.length) {
                list.innerHTML = '<div class="muted-text" style="padding:30px;text-align:center;font-size:13px;">No conversations yet.<br>Guest messages will appear here.</div>';
                return;
            }
            list.innerHTML = conversations.map(c => {
                const initials = getInitials(c.session_id);
                const channel = getChannelFromId(c.session_id);
                const displayId = c.session_id.length > 16 ? c.session_id.slice(-12) : c.session_id;
                const isActive = c.session_id === activeSessionId ? 'active' : '';
                return `
                    <div class="conv-item ${isActive}" onclick="loadMessages('${escapeHtml(c.session_id)}', '${escapeHtml(displayId)}')">
                        <div class="conv-avatar">${initials}</div>
                        <div class="conv-item-body">
                            <div class="conv-item-name">
                                ${displayId}
                                <span class="channel-badge">${channel}</span>
                            </div>
                            <div class="conv-item-meta">
                                <span>${timeAgo(c.last_message_at)}</span>
                                <span class="msg-count-badge">${c.message_count} msg</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterConvList(query) {
            const q = query.toLowerCase();
            renderFilteredList(allConversations.filter(c =>
                c.session_id.toLowerCase().includes(q)
            ));
        }

        async function loadMessages(sessionId, displayName) {
            activeSessionId = sessionId;
            // Re-render list to update active state
            const items = document.querySelectorAll('.conv-item');
            items.forEach(item => item.classList.remove('active'));
            event && event.target && event.target.closest('.conv-item') && event.target.closest('.conv-item').classList.add('active');

            const panel = document.getElementById('convMessages');
            panel.innerHTML = `
                <div class="conv-messages-header">
                    <i class="fas fa-user-circle" style="color:#c9a84c;font-size:18px;"></i>
                    <h3>${displayName}</h3>
                    <span class="session-label">Session: ${sessionId}</span>
                </div>
                <div class="conv-messages-body" id="msgBody">
                    <div class="muted-text" style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
            `;

            try {
                const resp = await fetch(`/api/v2/conversations/${encodeURIComponent(sessionId)}`, { headers: authHeaders() });
                const data = await resp.json();
                renderMessages(data.messages || []);
            } catch (err) {
                document.getElementById('msgBody').innerHTML =
                    '<div class="error-text" style="padding:20px;text-align:center;">Failed to load messages</div>';
            }
        }

        function renderMessages(messages) {
            const body = document.getElementById('msgBody');
            if (!messages.length) {
                body.innerHTML = '<div class="muted-text" style="text-align:center;padding:20px;">No messages in this conversation.</div>';
                return;
            }

            body.innerHTML = messages.map(m => {
                let msgObj = m.message;
                if (typeof msgObj === 'string') {
                    try { msgObj = JSON.parse(msgObj); } catch(e) {}
                }

                let text = '';
                let role = 'ai';

                if (typeof msgObj === 'object' && msgObj !== null) {
                    if (msgObj.type === 'human') {
                        role = 'human';
                        text = msgObj.data?.content || msgObj.content || JSON.stringify(msgObj);
                    } else if (msgObj.type === 'ai') {
                        role = 'ai';
                        text = msgObj.data?.content || msgObj.content || JSON.stringify(msgObj);
                    } else {
                        text = msgObj.content || msgObj.text || JSON.stringify(msgObj);
                    }
                } else {
                    text = String(msgObj || '');
                }

                const time = m.created_at ? new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
                const avatarIcon = role === 'ai' ? 'fas fa-robot' : 'fas fa-user';
                return `
                    <div class="msg-wrapper ${role}">
                        <div class="msg-avatar ${role}"><i class="${avatarIcon}"></i></div>
                        <div class="msg-inner ${role}">
                            <div class="msg-bubble ${role}">${escapeHtml(text)}</div>
                            <div class="msg-time">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');

            body.scrollTop = body.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('refreshBtn').addEventListener('click', loadConversations);

        // Init
        loadConversations();

        // Theme toggle — synced with ergovia_theme key (same as all other pages)
        (function() {
            const btn = document.getElementById('themeToggle');
            function updateIcon() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            }
            updateIcon();
            btn.addEventListener('click', function() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('ergovia_theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('ergovia_theme', 'dark');
                }
                updateIcon();
            });
        })();

        document.getElementById('userProfileBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('userDropdown').classList.toggle('show');
        });
        document.addEventListener('click', () => document.getElementById('userDropdown').classList.remove('show'));

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('ergovia_user');
            window.location.href = '/login.html';
        });

        // Load user name
        const user = JSON.parse(localStorage.getItem('ergovia_user') || '{}');
        if (user.username) {
            document.getElementById('userName').textContent = user.username;
            document.getElementById('dropdownUserName').textContent = user.username;
            document.getElementById('dropdownUserEmail').textContent = user.email || '';
        }
    </script>
</body>
</html>
