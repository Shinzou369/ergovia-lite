
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Sign In - ERGOVIA AI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .auth-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--ergovia-gradient);
            opacity: 0.1;
        }

        .auth-container {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 48px;
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .auth-logo img {
            width: 56px;
            height: 56px;
            border-radius: var(--radius);
        }

        .auth-logo-text {
            font-size: 2rem;
            font-weight: 800;
            background: var(--ergovia-text-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: var(--font-heading);
            letter-spacing: 0.02em;
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .affiliate-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(184, 134, 11, 0.1));
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: var(--radius-lg);
            padding: 8px 16px;
            font-size: 0.9rem;
            color: var(--ergovia-gold);
            font-weight: 600;
            margin-bottom: 24px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .form-input {
            padding: 16px 20px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--ergovia-gold);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        .auth-method-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--bg-primary);
            padding: 6px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }

        .auth-tab {
            flex: 1;
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .auth-tab.active {
            background: var(--ergovia-gradient);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .auth-method {
            display: none;
        }

        .auth-method.active {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 16px 24px;
            background: var(--ergovia-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-link a:hover {
            color: var(--ergovia-gold);
        }

        .security-note {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .input-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 24px;
                margin: 10px;
            }

            .auth-title {
                font-size: 1.5rem;
            }

            .auth-subtitle {
                font-size: 0.9rem;
            }

            .auth-logo-text {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">
                    <img src="LOGO.png" alt="ERGOVIA AI">
                    <span class="auth-logo-text">ERGOVIA AI</span>
                </div>
                <h1 class="auth-title">Affiliate Portal</h1>
                <p class="auth-subtitle">Welcome to the ERGOVIA AI Affiliate Program</p>
                <div class="affiliate-badge">
                    💼 Partner Access
                </div>
            </div>

            <div id="message"></div>

            <div class="auth-method-tabs">
                <button class="auth-tab active" data-method="email">✉️ Email Link</button>
                <button class="auth-tab" data-method="sms">📱 SMS Code</button>
            </div>

            <form class="auth-form" id="authForm">
                <!-- Email Magic Link Method -->
                <div class="auth-method active" id="email-method">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input"
                            placeholder="Enter your business email"
                            required
                        >
                        <div class="input-hint">We'll send you a secure login link</div>
                    </div>
                    <button type="submit" class="submit-btn" id="emailSubmit">
                        Send Magic Link
                    </button>
                </div>

                <!-- SMS OTP Method -->
                <div class="auth-method" id="sms-method">
                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            class="form-input"
                            placeholder="+1 (555) 123-4567"
                            required
                        >
                        <div class="input-hint">We'll send you a 6-digit verification code</div>
                    </div>
                    <button type="submit" class="submit-btn" id="smsSubmit">
                        Send SMS Code
                    </button>
                </div>

                <!-- OTP Verification (hidden initially) -->
                <div class="auth-method" id="otp-verification" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="otp">Enter 6-digit code</label>
                        <input 
                            type="text" 
                            id="otp" 
                            name="otp" 
                            class="form-input"
                            placeholder="000000"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            style="text-align: center; font-size: 1.2rem; letter-spacing: 0.2em;"
                        >
                        <div class="input-hint">Check your phone for the verification code</div>
                    </div>
                    <button type="button" class="submit-btn" id="otpSubmit">
                        Verify & Sign In
                    </button>
                    <button type="button" class="submit-btn" id="resendCode" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); margin-top: 12px;">
                        Resend Code
                    </button>
                </div>
            </form>

            <div class="security-note">
                🔒 Secure affiliate access powered by passwordless authentication
            </div>

            <div class="back-link">
                <a href="/">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        let currentMethod = 'email';
        let methodId = null;
        let phoneNumber = null;

        // Tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const method = tab.dataset.method;
                switchMethod(method);
            });
        });

        function switchMethod(method) {
            currentMethod = method;
            
            // Update tabs
            document.querySelectorAll('.auth-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.method === method);
            });
            
            // Update forms
            document.querySelectorAll('.auth-method').forEach(form => {
                form.classList.remove('active');
            });
            document.getElementById(`${method}-method`).classList.add('active');
            
            // Hide OTP verification
            document.getElementById('otp-verification').style.display = 'none';
            clearMessage();
        }

        // Form submission
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (currentMethod === 'email') {
                await sendMagicLink();
            } else if (currentMethod === 'sms') {
                await sendSMSCode();
            }
        });

        // OTP verification
        document.getElementById('otpSubmit').addEventListener('click', async () => {
            await verifyOTP();
        });

        // Resend code functionality
        document.getElementById('resendCode').addEventListener('click', async () => {
            if (phoneNumber) {
                document.getElementById('phone').value = phoneNumber;
                switchMethod('sms');
                await sendSMSCode();
            }
        });

        async function sendMagicLink() {
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('emailSubmit');
            
            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            setLoading(submitBtn, true, 'Sending Magic Link...');
            
            try {
                const response = await fetch('/api/auth/stytch/magic-links/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('🎉 Magic link sent! Check your email and click the link to access your affiliate portal.', 'success');
                } else {
                    showMessage(data.error || 'Failed to send magic link', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            } finally {
                setLoading(submitBtn, false, 'Send Magic Link');
            }
        }

        async function sendSMSCode() {
            const phone = document.getElementById('phone').value;
            const submitBtn = document.getElementById('smsSubmit');
            
            if (!phone) {
                showMessage('Please enter your phone number', 'error');
                return;
            }

            phoneNumber = phone; // Store for resend functionality
            setLoading(submitBtn, true, 'Sending Code...');
            
            try {
                const response = await fetch('/api/auth/stytch/otp/sms/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: phone })
                });

                const data = await response.json();

                if (data.success) {
                    methodId = data.request_id;
                    showMessage('📱 SMS code sent! Enter the 6-digit code below to access your affiliate portal.', 'success');
                    
                    // Show OTP verification
                    document.getElementById('sms-method').style.display = 'none';
                    document.getElementById('otp-verification').style.display = 'block';
                } else {
                    showMessage(data.error || 'Failed to send SMS code', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            } finally {
                setLoading(submitBtn, false, 'Send SMS Code');
            }
        }

        async function verifyOTP() {
            const otp = document.getElementById('otp').value;
            const submitBtn = document.getElementById('otpSubmit');
            
            if (!otp || otp.length !== 6) {
                showMessage('Please enter the complete 6-digit code', 'error');
                return;
            }

            if (!methodId) {
                showMessage('Please request a new code first', 'error');
                return;
            }

            setLoading(submitBtn, true, 'Verifying...');
            
            try {
                const response = await fetch('/api/auth/stytch/otp/authenticate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        method_id: methodId,
                        code: otp 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Authentication successful! Redirecting to affiliate portal...', 'success');
                    
                    setTimeout(() => {
                        if (data.needs_completion) {
                            window.location.href = '/complete-signup';
                        } else {
                            // Affiliate users go directly to chat
                            const urlParams = new URLSearchParams(window.location.search);
                            const returnTo = urlParams.get('return_to') || '/chat';
                            window.location.href = returnTo;
                        }
                    }, 1500);
                } else {
                    showMessage(data.error || 'Invalid or expired code', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            } finally {
                setLoading(submitBtn, false, 'Verify & Sign In');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
        }

        function clearMessage() {
            document.getElementById('message').innerHTML = '';
        }

        function setLoading(button, loading, text) {
            if (loading) {
                button.disabled = true;
                button.innerHTML = `<span class="loading"></span> ${text}`;
            } else {
                button.disabled = false;
                button.innerHTML = text;
            }
        }

        // Auto-format phone number
        document.getElementById('phone').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 1 && !value.startsWith('1')) {
                value = '1' + value;
            }
            if (value.length > 1) {
                value = '+' + value;
            }
            if (value.length > 4) {
                value = value.slice(0, 2) + ' (' + value.slice(2, 5) + ')';
            }
            if (value.length > 9) {
                value = value.slice(0, 9) + ' ' + value.slice(9, 12);
            }
            if (value.length > 13) {
                value = value.slice(0, 13) + '-' + value.slice(13, 17);
            }
            e.target.value = value;
        });

        // Auto-format OTP with better UX
        document.getElementById('otp').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
            
            // Auto-submit when 6 digits are entered
            if (e.target.value.length === 6) {
                setTimeout(() => {
                    verifyOTP();
                }, 500);
            }
        });

        // Check for URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            switch (error) {
                case 'missing_token':
                    showMessage('Authentication link is invalid or expired', 'error');
                    break;
                case 'auth_failed':
                    showMessage('Authentication failed. Please try again.', 'error');
                    break;
                default:
                    showMessage('Authentication error. Please try again.', 'error');
            }
        }

        // Show welcome message if coming from role selection
        const fromRole = urlParams.get('from');
        if (fromRole === 'role-selection') {
            showMessage('Please sign in to access your affiliate portal', 'success');
        }
    </script>
</body>
</html>
