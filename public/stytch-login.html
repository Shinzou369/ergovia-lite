
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Sign In - ERGOVIA AI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            background: linear-gradient(135deg, 
                var(--bg-primary) 0%, 
                #0a0f1c 25%, 
                #1a1f2e 50%, 
                var(--bg-secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .auth-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, 
                rgba(255, 215, 0, 0.08) 0%, 
                rgba(184, 165, 72, 0.05) 35%, 
                transparent 70%);
            animation: backgroundPulse 8s ease-in-out infinite;
        }

        @keyframes backgroundPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .auth-container {
            background: rgba(26, 31, 46, 0.95);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 48px;
            max-width: 520px;
            width: 100%;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 215, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            animation: containerSlideIn 0.8s ease-out;
        }

        @keyframes containerSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.03) 0%, 
                transparent 50%, 
                rgba(184, 165, 72, 0.02) 100%);
            border-radius: inherit;
            pointer-events: none;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
            animation: logoFadeIn 1s ease-out 0.3s both;
        }

        @keyframes logoFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-logo img {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
        }

        .auth-logo img:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.3);
        }

        .auth-logo-text {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, 
                #FFD700 0%, 
                #F4E4BC 25%, 
                #FFFFFF 50%, 
                #E6E6FA 75%, 
                #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: var(--font-heading);
            letter-spacing: 0.02em;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
            animation: textShimmer 3s ease-in-out infinite;
        }

        @keyframes textShimmer {
            0%, 100% { 
                background-position: 0% 50%; 
            }
            50% { 
                background-position: 100% 50%; 
            }
        }

        .auth-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            animation: titleSlideIn 0.8s ease-out 0.5s both;
        }

        @keyframes titleSlideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 8px;
            animation: subtitleSlideIn 0.8s ease-out 0.6s both;
        }

        @keyframes subtitleSlideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .affiliate-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.15) 0%, 
                rgba(184, 134, 11, 0.15) 100%);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 0.95rem;
            color: #FFD700;
            font-weight: 600;
            margin-bottom: 32px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.1);
            animation: badgeGlow 2s ease-in-out infinite;
        }

        @keyframes badgeGlow {
            0%, 100% { 
                box-shadow: 0 4px 15px rgba(255, 215, 0, 0.1);
            }
            50% { 
                box-shadow: 0 6px 20px rgba(255, 215, 0, 0.2);
            }
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
            z-index: 2;
        }

        .auth-method-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 32px;
            background: rgba(15, 15, 35, 0.8);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .auth-tab {
            flex: 1;
            padding: 14px 20px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
        }

        .auth-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 215, 0, 0.1), 
                transparent);
            transition: left 0.6s ease;
        }

        .auth-tab:hover::before {
            left: 100%;
        }

        .auth-tab.active {
            background: var(--ergovia-gradient);
            color: white;
            box-shadow: 
                0 4px 15px rgba(255, 215, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .auth-tab:hover:not(.active) {
            background: rgba(255, 215, 0, 0.05);
            color: var(--text-primary);
        }

        .auth-method {
            display: none;
            animation: methodFadeIn 0.5s ease-out;
        }

        @keyframes methodFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-method.active {
            display: block;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-left: 4px;
        }

        .form-input {
            padding: 18px 24px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            background: rgba(26, 31, 46, 0.8);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .form-input::placeholder {
            color: rgba(184, 188, 200, 0.6);
        }

        .form-input:focus {
            outline: none;
            border-color: #FFD700;
            background: rgba(26, 31, 46, 0.95);
            box-shadow: 
                0 0 0 4px rgba(255, 215, 0, 0.1),
                0 8px 25px rgba(255, 215, 0, 0.15);
            transform: translateY(-1px);
        }

        .submit-btn {
            width: 100%;
            padding: 18px 24px;
            background: var(--ergovia-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.2), 
                transparent);
            transition: left 0.6s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.2);
        }

        .message {
            padding: 18px 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid transparent;
            animation: messageSlideIn 0.5s ease-out;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: linear-gradient(135deg, 
                rgba(16, 185, 129, 0.15) 0%, 
                rgba(5, 150, 105, 0.15) 100%);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.1);
        }

        .message.error {
            background: linear-gradient(135deg, 
                rgba(239, 68, 68, 0.15) 0%, 
                rgba(220, 38, 38, 0.15) 100%);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.1);
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
        }

        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .back-link a:hover {
            color: var(--ergovia-gold);
            background: rgba(255, 215, 0, 0.05);
            transform: translateX(-2px);
        }

        .security-note {
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.08) 0%, 
                rgba(184, 165, 72, 0.08) 100%);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 32px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .security-note::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 215, 0, 0.05), 
                transparent);
            animation: securityShimmer 3s ease-in-out infinite;
        }

        @keyframes securityShimmer {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }

        .input-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
            margin-left: 4px;
        }

        /* OTP Verification Styles */
        #otp-verification {
            text-align: center;
        }

        #otp {
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 0.3em;
            font-weight: 600;
            background: rgba(26, 31, 46, 0.9);
        }

        #resendCode {
            background: transparent;
            border: 2px solid rgba(255, 215, 0, 0.3);
            color: var(--text-secondary);
            margin-top: 16px;
            font-size: 0.9rem;
            padding: 12px 20px;
        }

        #resendCode:hover {
            background: rgba(255, 215, 0, 0.05);
            border-color: rgba(255, 215, 0, 0.5);
            color: var(--text-primary);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 24px;
                margin: 10px;
                border-radius: 20px;
            }

            .auth-title {
                font-size: 1.6rem;
            }

            .auth-subtitle {
                font-size: 1rem;
            }

            .auth-logo-text {
                font-size: 1.8rem;
            }

            .auth-logo img {
                width: 56px;
                height: 56px;
            }

            .form-input {
                padding: 16px 20px;
                font-size: 16px; /* Prevent zoom on iOS */
            }

            .submit-btn {
                padding: 16px 20px;
                font-size: 1rem;
            }
        }

        /* Enhanced Floating Particles */
        .floating-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            animation: floatParticle 15s linear infinite;
        }

        .particle:nth-child(odd) {
            background: rgba(184, 165, 72, 0.4);
            animation-duration: 12s;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) translateX(10px) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(10vh) translateX(-10px) scale(1);
            }
            100% {
                transform: translateY(0) translateX(0) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <!-- Floating Particles -->
        <div class="floating-particles">
            <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
            <div class="particle" style="left: 20%; animation-delay: 2s;"></div>
            <div class="particle" style="left: 30%; animation-delay: 4s;"></div>
            <div class="particle" style="left: 40%; animation-delay: 1s;"></div>
            <div class="particle" style="left: 50%; animation-delay: 3s;"></div>
            <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
            <div class="particle" style="left: 70%; animation-delay: 1.5s;"></div>
            <div class="particle" style="left: 80%; animation-delay: 3.5s;"></div>
            <div class="particle" style="left: 90%; animation-delay: 2.5s;"></div>
        </div>

        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">
                    <img src="LOGO.png" alt="ERGOVIA AI">
                    <span class="auth-logo-text">ERGOVIA AI</span>
                </div>
                <h1 class="auth-title">Affiliate Portal</h1>
                <p class="auth-subtitle">Welcome to the ERGOVIA AI Affiliate Program</p>
                <div class="affiliate-badge">
                    💼 Partner Access
                </div>
            </div>

            <div id="message"></div>

            <div class="auth-method-tabs">
                <button class="auth-tab active" data-method="email">✉️ Email Link</button>
                <button class="auth-tab" data-method="sms">📱 SMS Code</button>
            </div>

            <form class="auth-form" id="authForm">
                <!-- Email Magic Link Method -->
                <div class="auth-method active" id="email-method">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input"
                            placeholder="Enter your business email"
                            required
                        >
                        <div class="input-hint">We'll send you a secure login link</div>
                    </div>
                    <button type="submit" class="submit-btn" id="emailSubmit">
                        Send Magic Link
                    </button>
                </div>

                <!-- SMS OTP Method -->
                <div class="auth-method" id="sms-method">
                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            class="form-input"
                            placeholder="+1 (555) 123-4567"
                            required
                        >
                        <div class="input-hint">We'll send you a 6-digit verification code</div>
                    </div>
                    <button type="submit" class="submit-btn" id="smsSubmit">
                        Send SMS Code
                    </button>
                </div>

                <!-- OTP Verification (hidden initially) -->
                <div class="auth-method" id="otp-verification" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="otp">Enter 6-digit code</label>
                        <input 
                            type="text" 
                            id="otp" 
                            name="otp" 
                            class="form-input"
                            placeholder="000000"
                            maxlength="6"
                            pattern="[0-9]{6}"
                        >
                        <div class="input-hint">Check your phone for the verification code</div>
                    </div>
                    <button type="button" class="submit-btn" id="otpSubmit">
                        Verify & Sign In
                    </button>
                    <button type="button" class="submit-btn" id="resendCode">
                        Resend Code
                    </button>
                </div>
            </form>

            <div class="security-note">
                🔒 Secure affiliate access powered by passwordless authentication
            </div>

            <div class="back-link">
                <a href="/">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        let currentMethod = 'email';
        let methodId = null;
        let phoneNumber = null;

        // Tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const method = tab.dataset.method;
                switchMethod(method);
            });
        });

        function switchMethod(method) {
            currentMethod = method;
            
            // Update tabs
            document.querySelectorAll('.auth-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.method === method);
            });
            
            // Update forms
            document.querySelectorAll('.auth-method').forEach(form => {
                form.classList.remove('active');
            });
            document.getElementById(`${method}-method`).classList.add('active');
            
            // Hide OTP verification
            document.getElementById('otp-verification').style.display = 'none';
            clearMessage();
        }

        // Form submission
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (currentMethod === 'email') {
                await sendMagicLink();
            } else if (currentMethod === 'sms') {
                await sendSMSCode();
            }
        });

        // OTP verification
        document.getElementById('otpSubmit').addEventListener('click', async () => {
            await verifyOTP();
        });

        // Resend code functionality
        document.getElementById('resendCode').addEventListener('click', async () => {
            if (phoneNumber) {
                document.getElementById('phone').value = phoneNumber;
                switchMethod('sms');
                await sendSMSCode();
            }
        });

        async function sendMagicLink() {
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('emailSubmit');
            
            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            setLoading(submitBtn, true, 'Sending Magic Link...');
            
            try {
                const response = await fetch('/api/auth/stytch/magic-links/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('🎉 Magic link sent! Check your email and click the link to access your affiliate portal.', 'success');
                } else {
                    showMessage(data.error || 'Failed to send magic link', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            } finally {
                setLoading(submitBtn, false, 'Send Magic Link');
            }
        }

        async function sendSMSCode() {
            const phone = document.getElementById('phone').value;
            const submitBtn = document.getElementById('smsSubmit');
            
            if (!phone) {
                showMessage('Please enter your phone number', 'error');
                return;
            }

            phoneNumber = phone; // Store for resend functionality
            setLoading(submitBtn, true, 'Sending Code...');
            
            try {
                const response = await fetch('/api/auth/stytch/otp/sms/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: phone })
                });

                const data = await response.json();

                if (data.success) {
                    methodId = data.request_id;
                    showMessage('📱 SMS code sent! Enter the 6-digit code below to access your affiliate portal.', 'success');
                    
                    // Show OTP verification
                    document.getElementById('sms-method').style.display = 'none';
                    document.getElementById('otp-verification').style.display = 'block';
                } else {
                    showMessage(data.error || 'Failed to send SMS code', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            } finally {
                setLoading(submitBtn, false, 'Send SMS Code');
            }
        }

        async function verifyOTP() {
            const otp = document.getElementById('otp').value;
            const submitBtn = document.getElementById('otpSubmit');
            
            if (!otp || otp.length !== 6) {
                showMessage('Please enter the complete 6-digit code', 'error');
                return;
            }

            if (!methodId) {
                showMessage('Please request a new code first', 'error');
                return;
            }

            setLoading(submitBtn, true, 'Verifying...');
            
            try {
                const response = await fetch('/api/auth/stytch/otp/authenticate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        method_id: methodId,
                        code: otp 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Authentication successful! Redirecting to affiliate portal...', 'success');
                    
                    setTimeout(() => {
                        if (data.needs_completion) {
                            window.location.href = '/complete-signup';
                        } else {
                            // Affiliate users go directly to chat
                            const urlParams = new URLSearchParams(window.location.search);
                            const returnTo = urlParams.get('return_to') || '/chat';
                            window.location.href = returnTo;
                        }
                    }, 1500);
                } else {
                    showMessage(data.error || 'Invalid or expired code', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            } finally {
                setLoading(submitBtn, false, 'Verify & Sign In');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
        }

        function clearMessage() {
            document.getElementById('message').innerHTML = '';
        }

        function setLoading(button, loading, text) {
            if (loading) {
                button.disabled = true;
                button.innerHTML = `<span class="loading"></span> ${text}`;
            } else {
                button.disabled = false;
                button.innerHTML = text;
            }
        }

        // Auto-format phone number
        document.getElementById('phone').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 1 && !value.startsWith('1')) {
                value = '1' + value;
            }
            if (value.length > 1) {
                value = '+' + value;
            }
            if (value.length > 4) {
                value = value.slice(0, 2) + ' (' + value.slice(2, 5) + ')';
            }
            if (value.length > 9) {
                value = value.slice(0, 9) + ' ' + value.slice(9, 12);
            }
            if (value.length > 13) {
                value = value.slice(0, 13) + '-' + value.slice(13, 17);
            }
            e.target.value = value;
        });

        // Auto-format OTP with better UX
        document.getElementById('otp').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
            
            // Auto-submit when 6 digits are entered
            if (e.target.value.length === 6) {
                setTimeout(() => {
                    verifyOTP();
                }, 500);
            }
        });

        // Check for URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            switch (error) {
                case 'missing_token':
                    showMessage('Authentication link is invalid or expired', 'error');
                    break;
                case 'auth_failed':
                    showMessage('Authentication failed. Please try again.', 'error');
                    break;
                default:
                    showMessage('Authentication error. Please try again.', 'error');
            }
        }

        // Show welcome message if coming from role selection
        const fromRole = urlParams.get('from');
        if (fromRole === 'role-selection') {
            showMessage('Please sign in to access your affiliate portal', 'success');
        }
    </script>
</body>
</html>
