<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Ergovia AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      display: block !important;
      max-width: 450px;
      width: 100%;
      padding: 40px;
      background: var(--bg-secondary);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      flex-direction: column !important;
      align-items: stretch !important;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      margin-bottom: 24px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text-primary);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-header h1 {
      color: var(--text-primary);
      font-size: 28px;
      margin-bottom: 10px;
    }

    .auth-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
    }

    .auth-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f9d423, #ff8c00);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .auth-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
    }

    .auth-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .auth-footer a {
      color: var(--secondary);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .password-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <a href="/" class="back-link">← Back to Home</a>

    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Sign up to access Ergovia AI</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="name">Name (Optional)</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          autocomplete="name"
          placeholder="Your name"
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          autocomplete="email"
          placeholder="your@email.com"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          autocomplete="new-password"
          placeholder="Create a password"
        >
        <div class="password-hint">
          At least 8 characters with uppercase, lowercase, and a number
        </div>
      </div>

      <div class="form-group">
        <label for="role">Account Type</label>
        <select 
          id="role" 
          name="role" 
          required
          style="width: 100%; padding: 12px 16px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-size: 14px; cursor: pointer;"
        >
          <option value="">Select account type...</option>
          <option value="client">Client - Access workflow templates and automations</option>
          <option value="affiliate">Affiliate - Access AI chat and advanced features</option>
        </select>
      </div>

      <button type="submit" class="auth-button" id="signupButton">
        Sign Up
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Log in</a>
    </div>
  </div>

  <script>
    // Check if user is already logged in and redirect to their role-specific page
    fetch('/api/auth/status')
      .then(res => res.json())
      .then(data => {
        if (data.authenticated && data.user) {
          // Redirect based on actual user role from session
          const redirectUrl = data.user.role === 'affiliate' ? '/chat' : '/taskforce';
          window.location.href = redirectUrl;
        }
      });

    // Pre-select role from URL parameter if provided
    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = urlParams.get('role');
    if (roleParam && (roleParam === 'affiliate' || roleParam === 'client')) {
      document.getElementById('role').value = roleParam;
    }

    const form = document.getElementById('signupForm');
    const errorDiv = document.getElementById('errorMessage');
    const submitButton = document.getElementById('signupButton');

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
    }

    function hideError() {
      errorDiv.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      // Validate role selection
      if (!role) {
        showError('Please select an account type.');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Creating account...';

      try {
        const response = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({ email, password, name, role })
        });

        const data = await response.json();

        if (data.success) {
          // Redirect based on actual user role from signup response
          const redirectUrl = data.user && data.user.role === 'affiliate' ? '/chat' : '/taskforce';
          window.location.href = redirectUrl;
        } else {
          showError(data.error || 'Signup failed. Please try again.');
          submitButton.disabled = false;
          submitButton.textContent = 'Sign Up';
        }
      } catch (error) {
        console.error('Signup error:', error);
        showError('An unexpected error occurred. Please try again.');
        submitButton.disabled = false;
        submitButton.textContent = 'Sign Up';
      }
    });
  </script>
</body>
</html>
