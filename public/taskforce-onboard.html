<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Clinic Taskforce - Onboarding</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .onboard-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
        }

        .onboard-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .onboard-header h1 {
            color: #10b981;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .onboard-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .form-section h2 {
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: var(--text-primary);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: var(--radius-md);
            display: none;
        }

        .result.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
        }

        .result.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="onboard-container">
            <div class="onboard-header">
                <h1>🐾 PETETF Onboarding</h1>
                <p>Get your AI veterinary assistant deployed in minutes</p>
            </div>

            <form id="petClinicOnboardingForm">
                <!-- Business Information -->
                <div class="form-section">
                    <h2>🏥 Clinic Information</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="clinicName">Clinic Name *</label>
                            <input type="text" id="clinicName" name="clinic_name" required 
                                   placeholder="Happy Paws Veterinary Clinic">
                        </div>
                        <div class="form-group">
                            <label for="contactEmail">Contact Email *</label>
                            <input type="email" id="contactEmail" name="contact_email" required 
                                   placeholder="info@happypaws.com">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="clinicPhone">Clinic Phone</label>
                            <input type="tel" id="clinicPhone" name="clinic_phone" 
                                   placeholder="(555) 123-4567">
                        </div>
                        <div class="form-group">
                            <label for="clinicHours">Operating Hours</label>
                            <input type="text" id="clinicHours" name="clinic_hours" 
                                   placeholder="Mon-Fri 8AM-6PM, Sat 9AM-2PM">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="clinicAddress">Clinic Address</label>
                        <textarea id="clinicAddress" name="clinic_address" rows="3" 
                                  placeholder="123 Main Street, Anytown, ST 12345"></textarea>
                    </div>
                </div>

                <!-- Services Configuration -->
                <div class="form-section">
                    <h2>⚕️ Services & Specialties</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="primaryServices">Primary Services</label>
                            <textarea id="primaryServices" name="primary_services" rows="3" 
                                      placeholder="General examinations, vaccinations, dental care, surgery, emergency care"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="emergencyPolicy">Emergency Policy</label>
                            <textarea id="emergencyPolicy" name="emergency_policy" rows="3" 
                                      placeholder="24/7 emergency line: (555) 999-HELP. After hours, call immediately for serious injuries or illness."></textarea>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="appointmentTypes">Appointment Types</label>
                            <input type="text" id="appointmentTypes" name="appointment_types" 
                                   placeholder="Wellness exams, vaccinations, dental, surgery">
                        </div>
                        <div class="form-group">
                            <label for="bookingSystem">Booking System URL</label>
                            <input type="url" id="bookingSystem" name="booking_system" 
                                   placeholder="https://your-booking-system.com">
                        </div>
                    </div>
                </div>

                <!-- AI Configuration -->
                <div class="form-section">
                    <h2>🤖 AI Assistant Configuration</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="aiPersonality">AI Personality</label>
                            <select id="aiPersonality" name="ai_personality">
                                <option value="friendly">Friendly & Caring</option>
                                <option value="professional">Professional & Clinical</option>
                                <option value="warm">Warm & Compassionate</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="responseStyle">Response Style</label>
                            <select id="responseStyle" name="response_style">
                                <option value="detailed">Detailed & Informative</option>
                                <option value="concise">Concise & Direct</option>
                                <option value="educational">Educational & Helpful</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="specialInstructions">Special Instructions for AI</label>
                        <textarea id="specialInstructions" name="special_instructions" rows="3" 
                                  placeholder="Any specific protocols, common conditions you treat, or special handling instructions for your clinic"></textarea>
                    </div>
                </div>

                <!-- Integration Settings -->
                <div class="form-section">
                    <h2>🔗 Integration Settings</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="smsAlerts">SMS Alert Number</label>
                            <input type="tel" id="smsAlerts" name="sms_alerts" 
                                   placeholder="(555) 123-4567 - for emergency notifications">
                        </div>
                        <div class="form-group">
                            <label for="emailAlerts">Email Alert Address</label>
                            <input type="email" id="emailAlerts" name="email_alerts" 
                                   placeholder="alerts@happypaws.com">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="chatPlatforms">Chat Platforms</label>
                            <input type="text" id="chatPlatforms" name="chat_platforms" 
                                   placeholder="Website chat, WhatsApp, Facebook Messenger">
                        </div>
                        <div class="form-group">
                            <label for="workflowTrigger">Workflow Trigger URL</label>
                            <input type="url" id="workflowTrigger" name="workflow_trigger" 
                                   placeholder="Your n8n webhook URL (if applicable)">
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    🚀 Deploy PETETF Assistant
                </button>
            </form>

            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        document.getElementById('petClinicOnboardingForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Deploying your PETETF assistant...';
            resultDiv.style.display = 'none';

            try {
                // Collect form data
                const formData = new FormData(this);
                const data = {
                    taskforce_type: 'pet-clinic',
                    name: formData.get('clinic_name'),
                    email: formData.get('contact_email'),
                    phone: formData.get('clinic_phone'),
                    address: formData.get('clinic_address'),
                    hours: formData.get('clinic_hours'),
                    services: formData.get('primary_services'),
                    emergency_policy: formData.get('emergency_policy'),
                    appointment_types: formData.get('appointment_types'),
                    booking_system: formData.get('booking_system'),
                    ai_personality: formData.get('ai_personality'),
                    response_style: formData.get('response_style'),
                    special_instructions: formData.get('special_instructions'),
                    sms_alerts: formData.get('sms_alerts'),
                    email_alerts: formData.get('email_alerts'),
                    chat_platforms: formData.get('chat_platforms'),
                    workflow_trigger: formData.get('workflow_trigger')
                };

                console.log('Submitting pet clinic data:', data);

                // Submit to ETF deployment endpoint
                const response = await fetch('/api/etf/deploy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>🎉 Success! Your PETETF Assistant has been deployed!</h3>
                        <p><strong>Deployed Workflows:</strong> ${result.duplicated_workflows?.length || 0}</p>
                        <p><strong>Client ID:</strong> ${result.client_id}</p>
                        <p>Your PETETF assistant is now ready to help with:</p>
                        <ul>
                            <li>📞 24/7 customer inquiries and triage</li>
                            <li>📅 Appointment booking assistance</li>
                            <li>🚨 Emergency detection and alerts</li>
                            <li>💬 Multi-platform chat support</li>
                        </ul>
                        <p><em>You will receive setup instructions via email shortly.</em></p>
                    `;

                    // Redirect to payment after a delay
                    setTimeout(() => {
                        window.location.href = '/thank-you.html?service=pet-clinic';
                    }, 3000);
                } else {
                    throw new Error(result.error || 'Deployment failed');
                }
            } catch (error) {
                console.error('Deployment error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Deployment Error</h3>
                    <p>There was an issue deploying your PETETF Assistant:</p>
                    <p><em>${error.message}</em></p>
                    <p>Please try again or contact support if the issue persists.</p>
                `;
            } finally {
                // Reset button
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Deploy PETETF Assistant';
                resultDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
