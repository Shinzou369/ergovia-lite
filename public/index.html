
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERGOVIA-AI - Choose Your Path</title>
    <link rel="icon" href="CHROME.png" type="image/png" />

    <!-- Inline critical ERGOVIA theme styles to prevent FOUC -->
    <style>
      /* Critical ERGOVIA-AI theme variables - loaded immediately */
      :root {
        --font-heading: "Questrial", "Inter", system-ui, sans-serif;
        --font-body: "Questrial", "Inter", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", "Monaco", "Inconsolata", monospace;

        /* ERGOVIA-AI Brand Colors - Brown to Yellow Gradient */
        --primary-gradient: linear-gradient(
          180deg,
          #6b5b1a 0%,
          #8b7e2a 30%,
          #b8a548 60%,
          #ffd700 100%
        );
        --secondary-gradient: linear-gradient(180deg, #6b5b1a 0%, #ffd700 100%);
        --gold-gradient: linear-gradient(
          180deg,
          #8b7e2a 0%,
          #b8a548 50%,
          #ffd700 100%
        );
        --warm-gradient: linear-gradient(180deg, #6b5b1a 0%, #ffd700 100%);

        --bg-primary: #0f0f23;
        --bg-secondary: #1a1a2e;
        --bg-tertiary: #16213e;
        --bg-chat: #1e2139;

        --text-primary: #ffffff;
        --text-secondary: #b8bcc8;
        --text-muted: #6b7280;

        --border-color: #2d3748;
        --border-light: #374151;

        --radius: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        --primary: #b8a548;
        --secondary: #ffd700;
        --accent: #8b7e2a;

        /* ERGOVIA-AI Brand Gradients */
        --ergovia-gradient: linear-gradient(
          180deg,
          #6b5b1a 0%,
          #8b7e2a 30%,
          #b8a548 60%,
          #ffd700 100%
        );
        --ergovia-text-gradient: linear-gradient(
          180deg,
          #6b5b1a,
          #8b7e2a,
          #b8a548,
          #ffd700
        );
        --ergovia-navy: linear-gradient(180deg, #6b5b1a 0%, #8b7e2a 100%);
        --ergovia-gold: linear-gradient(
          180deg,
          #8b7e2a 0%,
          #b8a548 50%,
          #ffd700 100%
        );
      }

      /* Dark theme specific (default) */
      [data-theme="dark"] {
        --bg-primary: #0f0f0f;
        --bg-secondary: #1a1a1a;
        --bg-tertiary: #262626;
        --bg-chat: #2d2d2d;
        --text-primary: #ffd700;
        --text-secondary: #d4ac0d;
        --text-muted: #b8860b;
        --border-color: #404040;
        --border-light: #525252;
        --primary-gradient: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
        --secondary-gradient: linear-gradient(135deg, #ffa500 0%, #ff8c00 100%);
      }

      /* Light theme */
      [data-theme="light"] {
        --bg-primary: #deede5;
        --bg-secondary: #eceae5;
        --bg-tertiary: #ced6e1;
        --bg-chat: #ffffff;
        --text-primary: #2c3e50;
        --text-secondary: #5a6c7d;
        --text-muted: #8a929c;
        --border-color: #d5dbe4;
        --border-light: #e5e8ed;
      }

      /* Base styles to prevent flicker */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-body);
        transition: var(--transition);
        overflow-x: hidden;
        height: 100vh;
      }

      /* Split Screen Container */
      .split-container {
        display: flex;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }

      .split-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
        position: relative;
        cursor: pointer;
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }

      /* Affiliate Section - Left Side */
      .affiliate-section {
        background: linear-gradient(135deg, #1a1a2e 0%, #2d1b2e 50%, #3d2a4f 100%);
        border-right: 2px solid rgba(255, 215, 0, 0.3);
        position: relative;
      }

      .affiliate-section::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(45deg, rgba(107, 91, 26, 0.1), rgba(139, 126, 42, 0.1), rgba(184, 165, 72, 0.1));
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .affiliate-section:hover::before {
        opacity: 1;
      }

      /* Client Section - Right Side */
      .client-section {
        background: linear-gradient(135deg, #1a2e1a 0%, #2e2d1b 50%, #4f3d2a 100%);
        border-left: 2px solid rgba(255, 215, 0, 0.3);
        position: relative;
      }

      .client-section::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(45deg, rgba(139, 126, 42, 0.1), rgba(184, 165, 72, 0.1), rgba(255, 215, 0, 0.1));
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .client-section:hover::before {
        opacity: 1;
      }

      /* Hover Effects */
      .split-section:hover {
        flex: 1.1;
        transform: scale(1.02);
        z-index: 10;
      }

      .split-section:not(:hover) {
        flex: 0.9;
        filter: brightness(0.8);
      }

      /* Section Content */
      .section-content {
        text-align: center;
        z-index: 5;
        position: relative;
        transition: all 0.4s ease;
      }

      .section-icon {
        font-size: 6rem;
        margin-bottom: 30px;
        opacity: 0.9;
        transition: all 0.4s ease;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      }

      .split-section:hover .section-icon {
        transform: scale(1.1);
        opacity: 1;
        filter: drop-shadow(0 8px 16px rgba(255, 215, 0, 0.4));
      }

      .section-title {
        font-size: 3.5rem;
        font-weight: 800;
        margin-bottom: 20px;
        background: var(--ergovia-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-family: var(--font-heading);
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      .section-subtitle {
        font-size: 1.3rem;
        color: var(--text-secondary);
        margin-bottom: 40px;
        max-width: 400px;
        line-height: 1.5;
      }

      .section-cta {
        background: var(--ergovia-gradient);
        color: white;
        padding: 18px 36px;
        border: none;
        border-radius: var(--radius-xl);
        font-size: 1.2rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px rgba(184, 165, 72, 0.3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-family: var(--font-heading);
      }

      .section-cta:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(184, 165, 72, 0.5);
        background: var(--ergovia-gold);
      }

      /* Floating particles animation */
      .particles {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .particle {
        position: absolute;
        border-radius: 50%;
        opacity: 0;
        animation: float-particles 8s linear infinite;
      }

      .affiliate-section .particle {
        background: rgba(147, 51, 234, 0.3);
        box-shadow: 0 0 20px rgba(147, 51, 234, 0.2);
      }

      .client-section .particle {
        background: rgba(34, 197, 94, 0.3);
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
      }

      @keyframes float-particles {
        0% {
          opacity: 0;
          transform: translateY(100vh) scale(0) rotate(0deg);
        }
        10% {
          opacity: 1;
          transform: translateY(90vh) scale(1) rotate(45deg);
        }
        90% {
          opacity: 1;
          transform: translateY(-10vh) scale(1) rotate(315deg);
        }
        100% {
          opacity: 0;
          transform: translateY(-20vh) scale(0) rotate(360deg);
        }
      }

      /* Logo at top center */
      .main-logo {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(26, 26, 46, 0.9);
        backdrop-filter: blur(10px);
        padding: 15px 25px;
        border-radius: var(--radius-xl);
        border: 2px solid rgba(255, 215, 0, 0.3);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      .main-logo img {
        width: 40px;
        height: 40px;
        object-fit: contain;
      }

      .main-logo-text {
        font-size: 1.8rem;
        font-weight: 800;
        background: var(--ergovia-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-family: var(--font-heading);
        letter-spacing: 0.02em;
      }

      /* Theme toggle button */
      .theme-toggle {
        position: absolute;
        top: 40px;
        right: 40px;
        z-index: 100;
        background: rgba(26, 26, 46, 0.9);
        border: 2px solid rgba(255, 215, 0, 0.3);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      }

      .theme-toggle:hover {
        transform: scale(1.1);
        box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
      }

      /* Responsive Design */
      @media (max-width: 968px) {
        .split-container {
          flex-direction: column;
        }

        .split-section {
          padding: 30px 20px;
          border: none;
        }

        .affiliate-section {
          border-bottom: 2px solid rgba(255, 215, 0, 0.3);
          border-right: none;
        }

        .client-section {
          border-top: 2px solid rgba(255, 215, 0, 0.3);
          border-left: none;
        }

        .section-title {
          font-size: 2.5rem;
        }

        .section-subtitle {
          font-size: 1.1rem;
        }

        .section-icon {
          font-size: 4rem;
          margin-bottom: 20px;
        }

        .main-logo {
          top: 20px;
          padding: 10px 20px;
        }

        .main-logo-text {
          font-size: 1.4rem;
        }

        .theme-toggle {
          top: 20px;
          right: 20px;
          width: 45px;
          height: 45px;
        }
      }

      @media (max-width: 640px) {
        .split-section {
          padding: 25px 15px;
        }

        .section-title {
          font-size: 2rem;
        }

        .section-subtitle {
          font-size: 1rem;
          margin-bottom: 30px;
        }

        .section-cta {
          padding: 15px 28px;
          font-size: 1rem;
        }

        .main-logo {
          top: 15px;
          padding: 8px 15px;
        }

        .main-logo img {
          width: 32px;
          height: 32px;
        }

        .main-logo-text {
          font-size: 1.2rem;
        }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Google Fonts including Questrial for clean typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Questrial:wght@400&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>

  <body>
    <!-- Main Logo at Top -->
    <div class="main-logo">
      <img src="LOGO.png" alt="Ergovia AI" />
      <span class="main-logo-text">ERGOVIA-AI</span>
    </div>

    <!-- Theme Toggle Button -->
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <i data-lucide="sun" id="theme-icon"></i>
    </button>

    <!-- Split Screen Container -->
    <div class="split-container">
      
      <!-- Affiliate Section (Left) -->
      <div class="split-section affiliate-section" onclick="redirectToAffiliate()">
        <div class="particles" id="affiliate-particles"></div>
        <div class="section-content">
          <div class="section-icon">💼</div>
          <h1 class="section-title">AFFILIATE</h1>
          <p class="section-subtitle">
            Start your own AI agency. Sell ready-to-use automations and earn recurring commissions.
          </p>
          <button class="section-cta">
            I want to be an Affiliate
          </button>
        </div>
      </div>

      <!-- Client Section (Right) -->
      <div class="split-section client-section" onclick="redirectToClient()">
        <div class="particles" id="client-particles"></div>
        <div class="section-content">
          <div class="section-icon">🚀</div>
          <h1 class="section-title">CLIENT</h1>
          <p class="section-subtitle">
            Automate your business with AI-powered workflows that handle tasks 24/7.
          </p>
          <button class="section-cta">
            I want to Automate my business
          </button>
        </div>
      </div>

    </div>

    <script>
      // Set theme immediately before DOM loads to prevent flicker
      (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();

      // Initialize page after DOM loads
      document.addEventListener("DOMContentLoaded", () => {
        // Initialize Lucide icons
        lucide.createIcons();

        // Initialize particles
        createParticles();

        console.log("ERGOVIA-AI split landing page initialized");
      });

      // Theme toggle function
      function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);

        // Update theme icon
        const themeIcon = document.getElementById('theme-icon');
        if (themeIcon) {
          themeIcon.setAttribute('data-lucide', newTheme === 'dark' ? 'sun' : 'moon');
          lucide.createIcons();
        }
      }

      // Redirect functions
      function redirectToAffiliate() {
        window.location.href = '/index.html';
      }

      function redirectToClient() {
        window.location.href = '/taskforce.html';
      }

      // Create floating particles
      function createParticles() {
        const affiliateParticles = document.getElementById('affiliate-particles');
        const clientParticles = document.getElementById('client-particles');

        // Create particles for affiliate section
        for (let i = 0; i < 12; i++) {
          createParticle(affiliateParticles, i);
        }

        // Create particles for client section
        for (let i = 0; i < 12; i++) {
          createParticle(clientParticles, i);
        }
      }

      function createParticle(container, index) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // Random properties
        const size = Math.random() * 8 + 4;
        const left = Math.random() * 100;
        const animationDelay = Math.random() * 8;
        
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = left + '%';
        particle.style.animationDelay = animationDelay + 's';
        
        container.appendChild(particle);
      }

      // Add click event listeners
      document.querySelector('.affiliate-section').addEventListener('click', redirectToAffiliate);
      document.querySelector('.client-section').addEventListener('click', redirectToClient);
    </script>
  </body>
</html>
