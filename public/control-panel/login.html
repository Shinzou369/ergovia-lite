<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Property Manager</title>
    <link rel="stylesheet" href="/assets/css/control-panel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo i {
            font-size: 4rem;
            color: var(--primary);
        }
        .login-logo h1 {
            margin-top: 15px;
            color: var(--dark);
        }
        .login-logo p {
            color: var(--gray);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <i class="fas fa-home"></i>
            <h1>AI Property Manager</h1>
            <p>Sign in to your control panel</p>
        </div>

        <div id="alertBox" class="alert" style="display: none;"></div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" required placeholder="Your password">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px; padding: 15px;">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: var(--gray);">
            Don't have an account? <a href="/contact.html" style="color: var(--primary);">Contact us</a>
        </p>
    </div>

    <script>
        const API_BASE = '/api/backend';

        (async () => {
            const authCheck = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' }).catch(() => null);
            if (authCheck && authCheck.ok) {
                window.location.href = 'dashboard.html';
            }
        })();

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                localStorage.setItem('prismity_client', JSON.stringify(data.client));

                alertBox.className = 'alert alert-success';
                alertBox.innerHTML = '<i class="fas fa-check"></i> Login successful! Redirecting...';
                alertBox.style.display = 'flex';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                alertBox.className = 'alert alert-error';
                alertBox.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message}`;
                alertBox.style.display = 'flex';
            }

            return false;
        }
    </script>
</body>
</html>
