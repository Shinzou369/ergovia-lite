
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test - ERGOVIA-AI</title>
    <link rel="icon" href="CHROME.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Questrial:wght@400&family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --primary-gradient: linear-gradient(180deg, #6B5B1A 0%, #8B7E2A 30%, #B8A548 60%, #FFD700 100%);
            --ergovia-text-gradient: linear-gradient(180deg, #6B5B1A, #8B7E2A, #B8A548, #FFD700);
            --font-heading: 'Questrial', 'Inter', system-ui, sans-serif;
            --font-body: 'Questrial', 'Inter', system-ui, sans-serif;
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #b8bcc8;
            --text-muted: #6b7280;
            --border-color: #2d3748;
            --border-light: #374151;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .logo img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 800;
            background: var(--ergovia-text-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: var(--font-heading);
        }

        .status-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(107, 91, 26, 0.3);
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .status-indicator.authenticated {
            background: var(--success);
            color: white;
        }

        .status-indicator.unauthenticated {
            background: var(--error);
            color: white;
        }

        .status-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .user-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .info-item {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
        }

        .info-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-body);
            margin-right: 12px;
            margin-bottom: 12px;
        }

        .btn.primary {
            background: var(--primary-gradient);
            color: var(--bg-primary);
        }

        .btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(184, 165, 72, 0.4);
        }

        .btn.secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        .btn.secondary:hover {
            background: var(--border-light);
        }

        .btn.danger {
            background: var(--error);
            color: white;
        }

        .btn.danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .message {
            padding: 16px;
            border-radius: var(--radius);
            margin-top: 16px;
            font-size: 0.95rem;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-links {
            text-align: center;
            margin-top: 32px;
        }

        .back-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 12px;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .back-links a:hover {
            color: var(--primary);
        }

        @media (max-width: 600px) {
            .user-info {
                grid-template-columns: 1fr;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="CHROME.png" alt="ERGOVIA-AI Logo">
                <div class="logo-text">ERGOVIA-AI</div>
            </div>
        </div>

        <div class="status-card">
            <div class="status-header">
                <div id="status-indicator" class="status-indicator unauthenticated">❌</div>
                <h1 id="status-title" class="status-title">Authentication Status</h1>
            </div>

            <div id="authenticated-content" style="display: none;">
                <div class="user-info">
                    <div class="info-item">
                        <div class="info-label">Name</div>
                        <div id="user-name" class="info-value">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Email</div>
                        <div id="user-email" class="info-value">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Role</div>
                        <div id="user-role" class="info-value">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Auth Method</div>
                        <div id="auth-method" class="info-value">-</div>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn danger" onclick="performLogout()">🚪 Logout</button>
                    <button class="btn secondary" onclick="checkAuthStatus()">🔄 Refresh Status</button>
                    <button class="btn secondary" onclick="window.location.href='/chat'">💬 Go to Chat</button>
                </div>
            </div>

            <div id="unauthenticated-content">
                <p style="color: var(--text-secondary); margin-bottom: 24px;">
                    You are not currently authenticated. Choose your login method based on your role:
                </p>

                <div class="actions">
                    <button class="btn primary" onclick="loginAsAffiliate()">
                        💼 Login as Affiliate (Stytch)
                    </button>
                    <button class="btn secondary" onclick="loginAsClient()">
                        🚀 Login as Client (Google)
                    </button>
                    <button class="btn secondary" onclick="checkAuthStatus()">🔄 Check Status</button>
                </div>
            </div>

            <div id="message-container"></div>
        </div>

        <div class="back-links">
            <a href="/">← Home</a>
            <a href="/chat">Chat</a>
            <a href="/stytch-test">Stytch Test</a>
        </div>
    </div>

    <script>
        let currentUser = null;

        // Check authentication status on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🧪 Auth Test Page Loaded');
            checkAuthStatus();
        });

        async function checkAuthStatus() {
            showMessage('Checking authentication status...', 'info');
            
            try {
                const response = await fetch('/api/auth/status');
                const data = await response.json();
                
                console.log('Auth status:', data);
                
                if (data.authenticated && data.user) {
                    showAuthenticatedState(data.user);
                } else {
                    showUnauthenticatedState();
                }
                
                hideMessage();
            } catch (error) {
                console.error('Error checking auth status:', error);
                showMessage(`Error checking authentication: ${error.message}`, 'error');
                showUnauthenticatedState();
            }
        }

        function showAuthenticatedState(user) {
            currentUser = user;
            
            // Update status indicator
            const indicator = document.getElementById('status-indicator');
            const title = document.getElementById('status-title');
            indicator.className = 'status-indicator authenticated';
            indicator.textContent = '✅';
            title.textContent = `Welcome, ${user.name}!`;
            
            // Update user info
            document.getElementById('user-name').textContent = user.name || 'Unknown';
            document.getElementById('user-email').textContent = user.email || 'Unknown';
            document.getElementById('user-role').textContent = user.role || 'Unknown';
            document.getElementById('auth-method').textContent = user.authMethod || 'Unknown';
            
            // Show authenticated content
            document.getElementById('authenticated-content').style.display = 'block';
            document.getElementById('unauthenticated-content').style.display = 'none';
        }

        function showUnauthenticatedState() {
            currentUser = null;
            
            // Update status indicator
            const indicator = document.getElementById('status-indicator');
            const title = document.getElementById('status-title');
            indicator.className = 'status-indicator unauthenticated';
            indicator.textContent = '❌';
            title.textContent = 'Not Authenticated';
            
            // Show unauthenticated content
            document.getElementById('authenticated-content').style.display = 'none';
            document.getElementById('unauthenticated-content').style.display = 'block';
        }

        function loginAsAffiliate() {
            showMessage('Redirecting to Stytch authentication for affiliates...', 'info');
            window.location.href = '/stytch-auth?flow=affiliate&return_to=' + encodeURIComponent('/auth-test');
        }

        function loginAsClient() {
            showMessage('Redirecting to Google authentication for clients...', 'info');
            window.location.href = '/auth/google';
        }

        async function performLogout() {
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span>Logging out...';
            btn.disabled = true;

            try {
                if (currentUser?.authMethod === 'stytch') {
                    // Stytch logout
                    const response = await fetch('/api/auth/stytch/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    
                    if (response.ok) {
                        showMessage('Logged out successfully via Stytch!', 'success');
                    } else {
                        throw new Error('Stytch logout failed');
                    }
                } else {
                    // Google logout
                    window.location.href = '/logout';
                    return; // Don't continue with the rest since we're redirecting
                }
                
                // Update UI to show logged out state
                setTimeout(() => {
                    showUnauthenticatedState();
                    hideMessage();
                }, 1500);
                
            } catch (error) {
                console.error('Logout error:', error);
                showMessage(`Logout failed: ${error.message}`, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function showMessage(message, type = 'info') {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
        }

        function hideMessage() {
            const container = document.getElementById('message-container');
            container.innerHTML = '';
        }
    </script>
</body>
</html>
