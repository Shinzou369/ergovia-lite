<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N8N Tag Test - ERGOVIA-AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(26, 26, 46, 0.8);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #374151;
        }

        h1 {
            background: linear-gradient(180deg, #6b5b1a 0%, #8b7e2a 30%, #b8a548 60%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-align: center;
        }

        .section {
            background: rgba(15, 15, 35, 0.6);
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section h2 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #b8bcc8;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 15, 35, 0.8);
            border: 1px solid #374151;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, #6b5b1a 0%, #ffd700 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            background: rgba(15, 15, 35, 0.8);
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #b8bcc8;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .success {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .error {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .workflow-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #374151;
            border-radius: 8px;
            background: rgba(15, 15, 35, 0.8);
        }

        .workflow-item {
            padding: 10px;
            border-bottom: 1px solid #374151;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .workflow-item:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .workflow-item:last-child {
            border-bottom: none;
        }

        .workflow-name {
            font-weight: 600;
            color: #ffd700;
        }

        .workflow-id {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .workflow-tags {
            font-size: 11px;
            color: #8b7280;
            margin-top: 4px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #374151;
            border-top: 2px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tag-preview {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            border-radius: 6px;
            padding: 8px 12px;
            margin: 5px 5px 5px 0;
            display: inline-block;
            font-size: 12px;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>N8N Tag API Test</h1>

        <!-- Connection Test Section -->
        <div class="section">
            <h2>1. Test N8N Connection</h2>
            <button class="btn" onclick="testConnection()">Test Connection</button>
            <div id="connectionResult" class="result" style="display: none;"></div>
        </div>

        <!-- List Workflows Section -->
        <div class="section">
            <h2>2. List Available Workflows</h2>
            <button class="btn" onclick="listWorkflows()">Load Workflows</button>
            <div id="workflowsResult" class="result" style="display: none;"></div>
            <div id="workflowsList" class="workflow-list" style="display: none;"></div>
        </div>

        <!-- Tag Operations Section -->
        <div class="section">
            <h2>3. Tag Operations</h2>

            <div class="form-group">
                <label for="tagName">Tag Name:</label>
                <input type="text" id="tagName" placeholder="Enter tag name (e.g., TEST_TAG)" value="TEST_TAG">
            </div>

            <button class="btn" onclick="createTag()">Create Tag</button>
            <button class="btn" onclick="listTags()">List All Tags</button>
            <div id="tagResult" class="result" style="display: none;"></div>
        </div>

        <!-- Apply Tags to Workflow Section -->
        <div class="section">
            <h2>4. Apply Tags to Workflow</h2>

            <div class="form-group">
                <label for="workflowId">Workflow ID:</label>
                <input type="text" id="workflowId" placeholder="Enter workflow ID or select from list above">
            </div>

            <div class="form-group">
                <label for="tagsToApply">Tags to Apply (JSON format):</label>
                <input type="text" id="tagsToApply" placeholder='[{"name": "TEST_TAG"}]' value='[{"name": "TEST_TAG"}]'>
                <small style="color: #6b7280; margin-top: 5px; display: block;">
                    Format: [{"name": "tag1"}, {"name": "tag2"}] or ["tag1", "tag2"]
                </small>
            </div>

            <div class="form-group">
                <label>Preview Tags:</label>
                <div id="tagPreview"></div>
            </div>

            <button class="btn" onclick="applyTags()">Apply Tags</button>
            <button class="btn" onclick="testBothFormats()">Test Both Formats</button>
            <button class="btn" onclick="testDirectN8NFormat()">Test Direct N8N Format</button>
            <div id="applyResult" class="result" style="display: none;"></div>
        </div>

        <!-- Debug Section -->
        <div class="section">
            <h2>5. Debug Information</h2>
            <button class="btn" onclick="debugWorkflows()">Debug All Workflows</button>
            <div id="debugResult" class="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Update tag preview when input changes
        document.getElementById('tagsToApply').addEventListener('input', updateTagPreview);
        document.getElementById('workflowId').addEventListener('input', updateTagPreview);

        function updateTagPreview() {
            const tagsInput = document.getElementById('tagsToApply').value;
            const preview = document.getElementById('tagPreview');

            try {
                const tags = JSON.parse(tagsInput);
                let html = '';

                if (Array.isArray(tags)) {
                    tags.forEach(tag => {
                        const tagName = typeof tag === 'string' ? tag : tag.name;
                        html += `<span class="tag-preview">${tagName}</span>`;
                    });
                }

                preview.innerHTML = html || '<span style="color: #6b7280;">No valid tags</span>';
            } catch (e) {
                preview.innerHTML = '<span style="color: #ef4444;">Invalid JSON format</span>';
            }
        }

        // Initialize preview
        updateTagPreview();

        async function makeRequest(endpoint, method = 'GET', data = null) {
            const resultDiv = document.querySelector('.result:last-of-type');

            try {
                const config = {
                    method,
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };

                if (data) {
                    config.body = JSON.stringify(data);
                }

                const response = await fetch(endpoint, config);
                const result = await response.json();

                return { success: response.ok, data: result, status: response.status };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        function showResult(elementId, content, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = `result ${isSuccess ? 'success' : 'error'}`;
            element.textContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
        }

        function showLoading(buttonElement) {
            buttonElement.disabled = true;
            buttonElement.innerHTML = '<span class="loading"></span>' + buttonElement.textContent;
        }

        function hideLoading(buttonElement, originalText) {
            buttonElement.disabled = false;
            buttonElement.innerHTML = originalText;
        }

        async function testConnection() {
            const btn = event.target;
            const originalText = btn.textContent;
            showLoading(btn);

            try {
                const response = await makeRequest('/api/etf/test-n8n');
                showResult('connectionResult', response.data, response.success);
            } catch (error) {
                showResult('connectionResult', `Error: ${error.message}`, false);
            } finally {
                hideLoading(btn, originalText);
            }
        }

        async function listWorkflows() {
            const btn = event.target;
            const originalText = btn.textContent;
            showLoading(btn);

            try {
                const response = await makeRequest('/api/etf/debug/workflows');
                showResult('workflowsResult', response.data, response.success);

                if (response.success && response.data.all_workflows) {
                    displayWorkflowsList(response.data.all_workflows);
                }
            } catch (error) {
                showResult('workflowsResult', `Error: ${error.message}`, false);
            } finally {
                hideLoading(btn, originalText);
            }
        }

        function displayWorkflowsList(workflows) {
            const listDiv = document.getElementById('workflowsList');
            listDiv.style.display = 'block';

            listDiv.innerHTML = workflows.map(workflow => `
                <div class="workflow-item" onclick="selectWorkflow('${workflow.id}')">
                    <div class="workflow-name">${workflow.name}</div>
                    <div class="workflow-id">ID: ${workflow.id}</div>
                    <div class="workflow-tags">Tags: ${JSON.stringify(workflow.tags)}</div>
                </div>
            `).join('');
        }

        function selectWorkflow(id) {
            document.getElementById('workflowId').value = id;
            updateTagPreview();
        }

        async function createTag() {
            const btn = event.target;
            const originalText = btn.textContent;
            const tagName = document.getElementById('tagName').value.trim();

            if (!tagName) {
                showResult('tagResult', 'Please enter a tag name', false);
                return;
            }

            showLoading(btn);

            try {
                // Test direct N8N API call
                const response = await fetch('/api/etf/test-create-tag', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tagName })
                });

                const result = await response.json();
                showResult('tagResult', result, response.ok);
            } catch (error) {
                showResult('tagResult', `Error: ${error.message}`, false);
            } finally {
                hideLoading(btn, originalText);
            }
        }

        async function listTags() {
            const btn = event.target;
            const originalText = btn.textContent;
            showLoading(btn);

            try {
                const response = await makeRequest('/api/etf/list-tags');
                showResult('tagResult', response.data, response.success);
            } catch (error) {
                showResult('tagResult', `Error: ${error.message}`, false);
            } finally {
                hideLoading(btn, originalText);
            }
        }

        async function applyTags() {
            const btn = event.target;
            const originalText = btn.textContent;
            const workflowId = document.getElementById('workflowId').value.trim();
            const tagsInput = document.getElementById('tagsToApply').value.trim();

            if (!workflowId || !tagsInput) {
                showResult('applyResult', 'Please enter both workflow ID and tags', false);
                return;
            }

            showLoading(btn);

            try {
                const tags = JSON.parse(tagsInput);

                const response = await fetch('/api/etf/test-apply-tags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workflowId, tags })
                });

                const result = await response.json();
                showResult('applyResult', result, response.ok);
            } catch (error) {
                showResult('applyResult', `Error: ${error.message}`, false);
            } finally {
                hideLoading(btn, originalText);
            }
        }

        async function testBothFormats() {
            const btn = event.target;
            const originalText = btn.textContent;
            const workflowId = document.getElementById('workflowId').value.trim();

            if (!workflowId) {
                showResult('applyResult', 'Please enter a workflow ID', false);
                return;
            }

            showLoading(btn);

            try {
                const response = await fetch('/api/etf/test-both-formats', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workflowId })
                });

                const result = await response.json();
                showResult('applyResult', result, response.ok);
            } catch (error) {
                showResult('applyResult', `Error: ${error.message}`, false);
            } finally {
                hideLoading(btn, originalText);
            }
        }

        async function testDirectN8NFormat() {
            const btn = event.target;
            const originalText = btn.textContent;
            const workflowId = document.getElementById('workflowId').value.trim();

            if (!workflowId) {
                showResult('applyResult', 'Please enter a workflow ID', false);
                return;
            }

            showLoading(btn);

            try {
                // First get available tags to use their IDs
                const tagsResponse = await makeRequest('/api/etf/list-tags');
                if (!tagsResponse.success || !tagsResponse.data.tags || tagsResponse.data.tags.length === 0) {
                    throw new Error('No tags available. Create a tag first.');
                }

                // Use the first available tag ID for testing
                const firstTagId = tagsResponse.data.tags[0].id;
                const tagIds = [firstTagId];

                console.log('Testing with tag IDs:', tagIds);

                const response = await fetch('/api/etf/test-direct-n8n-format', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workflowId, tagIds })
                });

                const result = await response.json();
                showResult('applyResult', result, response.ok);
            } catch (error) {
                showResult('applyResult', `Error: ${error.message}`, false);
            } finally {
                hideLoading(btn, originalText);
            }
        }

        async function debugWorkflows() {
            const btn = event.target;
            const originalText = btn.textContent;
            showLoading(btn);

            try {
                const response = await makeRequest('/api/etf/debug/workflows');
                showResult('debugResult', response.data, response.success);
            } catch (error) {
                showResult('debugResult', `Error: ${error.message}`, false);
            } finally {
                hideLoading(btn, originalText);
            }
        }
    </script>
</body>
</html>
