<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERGOVIA-AI</title>
    <link rel="icon" type="image/png" href="LOGO.png">
    <style>
    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --accent: #06b6d4;
      --background: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border-color: #374151;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --transition: all 0.2s ease-in-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, var(--background) 0%, #1e1b4b 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 48px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: var(--radius);
    }

    .login-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-description {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.5;
    }

    .google-auth-btn {
      width: 100%;
      padding: 16px 24px;
      background: white;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      border-radius: var(--radius-lg);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: var(--transition);
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .google-auth-btn:hover {
      background: #f9fafb;
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .google-auth-btn:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .divider span {
      padding: 0 16px;
    }

    .auth-links {
      text-align: center;
      margin-top: 24px;
    }

    .auth-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .auth-link:hover {
      color: var(--secondary);
      text-decoration: underline;
    }

    .back-home {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
    }

    .back-home a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .back-home a:hover {
      color: var(--text-secondary);
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 24px;
        margin: 10px;
      }

      .login-title {
        font-size: 1.25rem;
      }

      .login-description {
        font-size: 0.9rem;
      }
    }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="Logo_of_an_AI_called_Prismity.png" alt="Prismity AI" class="logo">
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-description">Sign in to continue to PRISMiTY.AI</p>
        </div>

        <div class="login-form">
            <button class="google-auth-btn" onclick="window.location.href='/stytch-login.html'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                Continue with Stytch
            </button>

            <div class="divider">
                <span>Or</span>
            </div>

            <div class="auth-links">
                <p>Don't have an account? <a href="/signup" class="auth-link">Sign up here</a></p>
            </div>
        </div>

        <div class="back-home">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script>
        // Check for auth errors
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'auth_failed') {
            // Display error message if auth failed
            const errorContainer = document.getElementById('error-container'); // Assuming an error container exists
            if (errorContainer) {
                errorContainer.innerHTML = '<div class="error-message">Authentication failed. Please try again.</div>';
            } else {
                // Fallback if error-container is not found
                alert('Authentication failed. Please try again.');
            }
        }
    </script>
</body>
</html>
