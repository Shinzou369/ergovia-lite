<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - Prismity AI</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    .verification-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      padding: 20px;
    }

    .verification-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
    }

    .verification-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .verification-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-primary);
    }

    .verification-subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .email-display {
      background: var(--bg-tertiary);
      padding: 10px 15px;
      border-radius: var(--radius);
      margin-bottom: 30px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .otp-input-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .otp-digit {
      width: 50px;
      height: 50px;
      border: 2px solid var(--border-color);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      transition: all 0.3s ease;
    }

    .otp-digit:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
    }

    .verify-btn {
      width: 100%;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 15px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    .verify-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .verify-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .resend-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .resend-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.9rem;
    }

    .timer {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 15px;
      border-radius: var(--radius);
      margin-top: 20px;
    }

    @keyframes pulse-glow {
      0%, 100% {
        opacity: 0.6;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }
  </style>
</head>
<body>
  <div class="verification-container">
    <div class="verification-card">
      <div class="verification-icon">📧</div>
      <h1 class="verification-title">Verify Your Email</h1>
      <p class="verification-subtitle">
        We've sent a 6-digit verification code to:
      </p>

      <div class="email-display" id="email-display">
        Loading...
      </div>

      <div class="otp-input-container">
        <input type="text" class="otp-digit" maxlength="1" data-index="0">
        <input type="text" class="otp-digit" maxlength="1" data-index="1">
        <input type="text" class="otp-digit" maxlength="1" data-index="2">
        <input type="text" class="otp-digit" maxlength="1" data-index="3">
        <input type="text" class="otp-digit" maxlength="1" data-index="4">
        <input type="text" class="otp-digit" maxlength="1" data-index="5">
      </div>

      <button class="verify-btn" id="verify-btn" disabled>
        Verify Email
      </button>

      <div class="resend-container">
        <button class="resend-btn" id="resend-btn" disabled>
          Resend Code
        </button>
        <div class="timer" id="timer"></div>
      </div>

      <div class="error-message" id="error-message" style="display: none;"></div>
    </div>
  </div>

  <script>
    // OTP input handling
    const otpInputs = document.querySelectorAll('.otp-digit');
    const verifyBtn = document.getElementById('verify-btn');

    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const value = e.target.value;

        if (value.length === 1 && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }

        // Check if all inputs are filled
        const allFilled = Array.from(otpInputs).every(input => input.value.length === 1);
        verifyBtn.disabled = !allFilled;
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });
    });

    // Load email from URL params or session
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email') || 'your-email@example.com';
      document.getElementById('email-display').textContent = email;
    });

    // Verify button handler
    verifyBtn.addEventListener('click', () => {
      const code = Array.from(otpInputs).map(input => input.value).join('');
      console.log('Verification code:', code);
      // Add verification logic here
    });
  </script>
</body>
</html>
