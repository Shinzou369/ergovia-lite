<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties - AI Property Manager</title>
    <link rel="stylesheet" href="/assets/css/control-panel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-home"></i>
                <span>AI Property Manager</span>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Settings</span>
                </a>
                <a href="properties.html" class="nav-item active">
                    <i class="fas fa-building"></i>
                    <span>Properties</span>
                </a>
            </div>
            <div class="nav-user">
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                    <span id="userName">Owner</span>
                </div>
                <button class="btn-secondary" onclick="logout()" style="margin-left:10px;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="section-header" style="margin-bottom: 25px;">
            <h2><i class="fas fa-building"></i> My Properties</h2>
            <button class="btn-primary" onclick="showAddPropertyModal()">
                <i class="fas fa-plus"></i> Add Property
            </button>
        </div>

        <div id="alertBox" class="alert" style="display: none;"></div>

        <div id="propertiesContainer">
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <div id="propertyModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div class="form-container" style="max-width: 600px; max-height: 90vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="modalTitle"><i class="fas fa-building"></i> Add Property</h2>
                <button class="btn-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>

            <form id="propertyForm" onsubmit="return saveProperty(event)">
                <input type="hidden" id="propertyId" name="propertyId">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="propertyName">
                            <i class="fas fa-home"></i> Property Name <span class="required">*</span>
                        </label>
                        <input type="text" id="propertyName" name="propertyName" required placeholder="Beach House">
                    </div>
                    <div class="form-group">
                        <label for="propertyType">
                            <i class="fas fa-tag"></i> Type
                        </label>
                        <select id="propertyType" name="propertyType">
                            <option value="apartment">Apartment</option>
                            <option value="house">House</option>
                            <option value="villa">Villa</option>
                            <option value="studio">Studio</option>
                            <option value="room">Room</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="propertyAddress">
                            <i class="fas fa-map-marker-alt"></i> Address <span class="required">*</span>
                        </label>
                        <input type="text" id="propertyAddress" name="propertyAddress" required placeholder="123 Beach Road, Barcelona">
                    </div>
                    <div class="form-group">
                        <label for="bedrooms">
                            <i class="fas fa-bed"></i> Bedrooms
                        </label>
                        <input type="number" id="bedrooms" name="bedrooms" min="0" max="20" value="1">
                    </div>
                    <div class="form-group">
                        <label for="bathrooms">
                            <i class="fas fa-bath"></i> Bathrooms
                        </label>
                        <input type="number" id="bathrooms" name="bathrooms" min="0" max="10" value="1">
                    </div>
                    <div class="form-group">
                        <label for="maxGuests">
                            <i class="fas fa-users"></i> Max Guests
                        </label>
                        <input type="number" id="maxGuests" name="maxGuests" min="1" max="50" value="4">
                    </div>
                    <div class="form-group">
                        <label for="nightlyRate">
                            <i class="fas fa-euro-sign"></i> Nightly Rate (€)
                        </label>
                        <input type="number" id="nightlyRate" name="nightlyRate" min="0" step="0.01" value="100">
                    </div>
                    <div class="form-group">
                        <label for="cleaningFee">
                            <i class="fas fa-broom"></i> Cleaning Fee (€)
                        </label>
                        <input type="number" id="cleaningFee" name="cleaningFee" min="0" step="0.01" value="50">
                    </div>
                    <div class="form-group">
                        <label for="propertyStatus">
                            <i class="fas fa-toggle-on"></i> Status
                        </label>
                        <select id="propertyStatus" name="propertyStatus">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                            <option value="maintenance">Under Maintenance</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 30px;">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Save Property
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/backend';
        let properties = [];

        async function init() {
            const authCheck = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
            if (!authCheck.ok) {
                window.location.href = 'login.html';
                return;
            }
            await loadProperties();
        }

        async function apiRequest(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include'
            };
            if (data) options.body = JSON.stringify(data);
            const response = await fetch(`${API_BASE}${endpoint}`, options);
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            return response.json();
        }

        async function loadProperties() {
            try {
                const data = await apiRequest('/control-panel/properties');
                properties = data.properties || [];
                renderProperties();
            } catch (error) {
                console.error('Failed to load properties:', error);
                showAlert('Failed to load properties', 'error');
            }
        }

        function renderProperties() {
            const container = document.getElementById('propertiesContainer');
            
            if (properties.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-building"></i>
                        <h3>No properties yet</h3>
                        <p>Add your first property to get started</p>
                        <button class="btn-primary" onclick="showAddPropertyModal()" style="margin-top: 20px;">
                            <i class="fas fa-plus"></i> Add Property
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = properties.map(prop => `
                <div class="property-card">
                    <div class="property-header">
                        <span class="property-name">${escapeHtml(prop.name)}</span>
                        <span class="property-status ${prop.status || 'active'}">${prop.status || 'Active'}</span>
                    </div>
                    <div class="property-details">
                        <div class="property-detail">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${escapeHtml(prop.address || 'No address')}</span>
                        </div>
                        <div class="property-detail">
                            <i class="fas fa-bed"></i>
                            <span>${prop.bedrooms || 0} bedrooms</span>
                        </div>
                        <div class="property-detail">
                            <i class="fas fa-users"></i>
                            <span>Up to ${prop.maxGuests || 0} guests</span>
                        </div>
                        <div class="property-detail">
                            <i class="fas fa-euro-sign"></i>
                            <span>€${prop.nightlyRate || 0}/night</span>
                        </div>
                    </div>
                    <div class="property-actions">
                        <button class="btn-secondary" onclick="editProperty('${prop.id}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn-danger" onclick="deleteProperty('${prop.id}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function showAddPropertyModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-building"></i> Add Property';
            document.getElementById('propertyForm').reset();
            document.getElementById('propertyId').value = '';
            document.getElementById('propertyModal').style.display = 'flex';
        }

        function editProperty(id) {
            const prop = properties.find(p => p.id === id);
            if (!prop) return;

            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Edit Property';
            document.getElementById('propertyId').value = prop.id;
            document.getElementById('propertyName').value = prop.name || '';
            document.getElementById('propertyType').value = prop.type || 'apartment';
            document.getElementById('propertyAddress').value = prop.address || '';
            document.getElementById('bedrooms').value = prop.bedrooms || 1;
            document.getElementById('bathrooms').value = prop.bathrooms || 1;
            document.getElementById('maxGuests').value = prop.maxGuests || 4;
            document.getElementById('nightlyRate').value = prop.nightlyRate || 100;
            document.getElementById('cleaningFee').value = prop.cleaningFee || 50;
            document.getElementById('propertyStatus').value = prop.status || 'active';

            document.getElementById('propertyModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('propertyModal').style.display = 'none';
        }

        async function saveProperty(event) {
            event.preventDefault();

            const property = {
                id: document.getElementById('propertyId').value || null,
                name: document.getElementById('propertyName').value,
                type: document.getElementById('propertyType').value,
                address: document.getElementById('propertyAddress').value,
                bedrooms: parseInt(document.getElementById('bedrooms').value),
                bathrooms: parseInt(document.getElementById('bathrooms').value),
                maxGuests: parseInt(document.getElementById('maxGuests').value),
                nightlyRate: parseFloat(document.getElementById('nightlyRate').value),
                cleaningFee: parseFloat(document.getElementById('cleaningFee').value),
                status: document.getElementById('propertyStatus').value
            };

            try {
                await apiRequest('/control-panel/properties', 'POST', { property });
                closeModal();
                showAlert('Property saved successfully!', 'success');
                await loadProperties();
            } catch (error) {
                showAlert('Failed to save property: ' + error.message, 'error');
            }

            return false;
        }

        async function deleteProperty(id) {
            if (!confirm('Are you sure you want to delete this property?')) return;

            try {
                await apiRequest(`/control-panel/properties/${id}`, 'DELETE');
                showAlert('Property deleted', 'success');
                await loadProperties();
            } catch (error) {
                showAlert('Failed to delete property: ' + error.message, 'error');
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.innerHTML = `<i class="fas fa-${type === 'success' ? 'check' : 'exclamation-circle'}"></i> ${message}`;
            alertBox.style.display = 'flex';
            setTimeout(() => alertBox.style.display = 'none', 5000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function logout() {
            await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' });
            localStorage.removeItem('prismity_client');
            window.location.href = 'login.html';
        }

        init();
    </script>
</body>
</html>
