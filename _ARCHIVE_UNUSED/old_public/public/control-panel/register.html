<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AI Property Manager</title>
    <link rel="stylesheet" href="/assets/css/control-panel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .register-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .register-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .register-logo i {
            font-size: 4rem;
            color: var(--primary);
        }
        .register-logo h1 {
            margin-top: 15px;
            color: var(--dark);
        }
        .register-logo p {
            color: var(--gray);
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-logo">
            <i class="fas fa-user-plus"></i>
            <h1>Create Account</h1>
            <p>Sign up for AI Property Manager</p>
        </div>

        <div id="alertBox" class="alert" style="display: none;"></div>

        <form id="registerForm" onsubmit="return handleRegister(event)">
            <div class="form-group">
                <label for="name">
                    <i class="fas fa-user"></i> Full Name
                </label>
                <input type="text" id="name" name="name" required placeholder="John Smith">
            </div>

            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" required placeholder="Create a password" minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    <i class="fas fa-lock"></i> Confirm Password
                </label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password" minlength="6">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px; padding: 15px;">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: var(--gray);">
            Already have an account? <a href="login.html" style="color: var(--primary);">Sign in</a>
        </p>
    </div>

    <script>
        // Check if already logged in
        (async () => {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'dashboard.html';
            }
        })();

        async function handleRegister(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertBox = document.getElementById('alertBox');

            try {
                // Validation
                if (password !== confirmPassword) {
                    throw new Error('Passwords do not match');
                }

                if (password.length < 6) {
                    throw new Error('Password must be at least 6 characters');
                }

                // Get existing accounts
                const accounts = JSON.parse(localStorage.getItem('localAccounts') || '[]');

                // Check if email already exists
                if (accounts.find(acc => acc.email === email)) {
                    throw new Error('An account with this email already exists');
                }

                // Create new account
                const newAccount = {
                    email,
                    password, // In production, this should be hashed!
                    name,
                    createdAt: new Date().toISOString()
                };

                accounts.push(newAccount);
                localStorage.setItem('localAccounts', JSON.stringify(accounts));

                // Auto-login the user
                localStorage.setItem('currentUser', JSON.stringify({
                    email: newAccount.email,
                    name: newAccount.name,
                    createdAt: newAccount.createdAt
                }));

                alertBox.className = 'alert alert-success';
                alertBox.innerHTML = '<i class="fas fa-check"></i> Account created successfully! Redirecting...';
                alertBox.style.display = 'flex';

                setTimeout(() => {
                    window.location.href = 'onboarding.html';
                }, 1500);

            } catch (error) {
                alertBox.className = 'alert alert-error';
                alertBox.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message}`;
                alertBox.style.display = 'flex';
            }

            return false;
        }
    </script>
</body>
</html>
