<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - AI Property Manager</title>
    <link rel="stylesheet" href="/assets/css/control-panel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-home"></i>
                <span>AI Property Manager</span>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="settings.html" class="nav-item active">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Settings</span>
                </a>
                <a href="properties.html" class="nav-item">
                    <i class="fas fa-building"></i>
                    <span>Properties</span>
                </a>
            </div>
            <div class="nav-user">
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                    <span id="userName">Owner</span>
                </div>
                <button class="btn-secondary" onclick="logout()" style="margin-left:10px;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">0% Complete</p>
        </div>

        <div id="alertBox" class="alert" style="display: none;"></div>

        <div class="form-container">
            <h1><i class="fas fa-cog"></i> Property Manager Settings</h1>
            <p class="form-subtitle">Complete all sections to activate your AI assistant</p>

            <form id="settingsForm" onsubmit="return saveSettings(event)">
                <div class="form-section">
                    <div class="section-header-form">
                        <h2><i class="fas fa-user"></i> 1. Owner Information</h2>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="ownerName">
                                <i class="fas fa-user"></i> Full Name <span class="required">*</span>
                            </label>
                            <input type="text" id="ownerName" name="ownerName" required placeholder="John Smith">
                        </div>
                        <div class="form-group">
                            <label for="ownerEmail">
                                <i class="fas fa-envelope"></i> Email <span class="required">*</span>
                            </label>
                            <input type="email" id="ownerEmail" name="ownerEmail" required placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label for="ownerPhone">
                                <i class="fas fa-phone"></i> Phone <span class="required">*</span>
                            </label>
                            <input type="tel" id="ownerPhone" name="ownerPhone" required placeholder="+1234567890">
                        </div>
                        <div class="form-group">
                            <label for="preferredPlatform">
                                <i class="fas fa-comments"></i> Preferred Contact Platform
                            </label>
                            <select id="preferredPlatform" name="preferredPlatform">
                                <option value="telegram">Telegram</option>
                                <option value="whatsapp">WhatsApp</option>
                                <option value="sms">SMS</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-header-form">
                        <h2><i class="fas fa-building"></i> 2. Business Information</h2>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="businessName">
                                <i class="fas fa-briefcase"></i> Business Name <span class="required">*</span>
                            </label>
                            <input type="text" id="businessName" name="businessName" required placeholder="My Vacation Rentals">
                        </div>
                        <div class="form-group">
                            <label for="businessAddress">
                                <i class="fas fa-map-marker-alt"></i> Address
                            </label>
                            <input type="text" id="businessAddress" name="businessAddress" placeholder="123 Main St, City">
                        </div>
                        <div class="form-group">
                            <label for="timezone">
                                <i class="fas fa-clock"></i> Timezone
                            </label>
                            <select id="timezone" name="timezone">
                                <option value="Europe/Berlin">Europe/Berlin (CET)</option>
                                <option value="Europe/London">Europe/London (GMT)</option>
                                <option value="America/New_York">America/New York (EST)</option>
                                <option value="America/Los_Angeles">America/Los Angeles (PST)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-header-form">
                        <h2><i class="fas fa-sliders-h"></i> 3. AI Preferences</h2>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="aiResponseStyle">
                                <i class="fas fa-comment-dots"></i> AI Response Style
                            </label>
                            <select id="aiResponseStyle" name="aiResponseStyle">
                                <option value="professional">Professional</option>
                                <option value="friendly">Friendly</option>
                                <option value="casual">Casual</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="defaultLanguage">
                                <i class="fas fa-language"></i> Default Language
                            </label>
                            <select id="defaultLanguage" name="defaultLanguage">
                                <option value="en">English</option>
                                <option value="de">Deutsch</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="aiInstructions">
                                <i class="fas fa-scroll"></i> Special AI Instructions
                            </label>
                            <textarea id="aiInstructions" name="aiInstructions" rows="4" placeholder="Any special instructions for your AI assistant..."></textarea>
                            <small class="help-text">Up to 2000 characters</small>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 30px;">
                    <button type="button" class="btn-secondary" onclick="loadSettings()">
                        <i class="fas fa-undo"></i> Reset
                    </button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Save Settings
                    </button>
                </div>
            </form>

        </div>
    </div>

    <script>
        const API_BASE = '/api/backend';

        async function init() {
            const authCheck = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
            if (!authCheck.ok) {
                window.location.href = 'login.html';
                return;
            }
            await Promise.all([loadSettings(), loadWorkflows()]);
        }

        async function apiRequest(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include'
            };
            if (data) options.body = JSON.stringify(data);
            const response = await fetch(`${API_BASE}${endpoint}`, options);
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            return response.json();
        }

        async function loadSettings() {
            try {
                const data = await apiRequest('/control-panel/settings');
                const settings = data.settings || {};

                if (settings.owner) {
                    document.getElementById('ownerName').value = settings.owner.name || '';
                    document.getElementById('ownerEmail').value = settings.owner.email || '';
                    document.getElementById('ownerPhone').value = settings.owner.phone || '';
                    document.getElementById('preferredPlatform').value = settings.owner.preferredPlatform || 'telegram';
                }

                if (settings.business) {
                    document.getElementById('businessName').value = settings.business.name || '';
                    document.getElementById('businessAddress').value = settings.business.address || '';
                    document.getElementById('timezone').value = settings.business.timezone || 'Europe/Berlin';
                }

                if (settings.credentials) {
                    document.getElementById('telegramChatId').value = settings.credentials.telegramChatId || '';
                }

                if (settings.ai) {
                    document.getElementById('aiResponseStyle').value = settings.ai.responseStyle || 'professional';
                    document.getElementById('defaultLanguage').value = settings.ai.defaultLanguage || 'en';
                    document.getElementById('aiInstructions').value = settings.ai.instructions || '';
                }

                updateProgress();
            } catch (error) {
                console.error('Failed to load settings:', error);
            }
        }

        async function saveSettings(event) {
            event.preventDefault();
            const alertBox = document.getElementById('alertBox');

            try {
                await apiRequest('/control-panel/settings', 'POST', {
                    section: 'owner',
                    data: {
                        name: document.getElementById('ownerName').value,
                        email: document.getElementById('ownerEmail').value,
                        phone: document.getElementById('ownerPhone').value,
                        preferredPlatform: document.getElementById('preferredPlatform').value
                    }
                });

                await apiRequest('/control-panel/settings', 'POST', {
                    section: 'business',
                    data: {
                        name: document.getElementById('businessName').value,
                        address: document.getElementById('businessAddress').value,
                        timezone: document.getElementById('timezone').value
                    }
                });

                await apiRequest('/control-panel/settings', 'POST', {
                    section: 'credentials',
                    data: {
                        telegramBotToken: document.getElementById('telegramBotToken').value || undefined,
                        telegramChatId: document.getElementById('telegramChatId').value,
                        openaiApiKey: document.getElementById('openaiApiKey').value || undefined
                    }
                });

                await apiRequest('/control-panel/settings', 'POST', {
                    section: 'ai',
                    data: {
                        responseStyle: document.getElementById('aiResponseStyle').value,
                        defaultLanguage: document.getElementById('defaultLanguage').value,
                        instructions: document.getElementById('aiInstructions').value
                    }
                });

                alertBox.className = 'alert alert-success';
                alertBox.innerHTML = '<i class="fas fa-check"></i> Settings saved successfully!';
                alertBox.style.display = 'flex';

                updateProgress();

            } catch (error) {
                alertBox.className = 'alert alert-error';
                alertBox.innerHTML = `<i class="fas fa-exclamation-circle"></i> Failed to save: ${error.message}`;
                alertBox.style.display = 'flex';
            }

            return false;
        }

        function updateProgress() {
            const requiredFields = ['ownerName', 'ownerEmail', 'ownerPhone', 'businessName'];
            const filled = requiredFields.filter(id => document.getElementById(id).value.trim() !== '').length;
            const percent = Math.round((filled / requiredFields.length) * 100);
            
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = percent + '% Complete';
        }

        async function logout() {
            await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' });
            localStorage.removeItem('prismity_client');
            window.location.href = 'login.html';
        }

        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.addEventListener('change', updateProgress);
        });

        async function loadWorkflows() {
            try {
                const data = await apiRequest('/control-panel/workflows');
                const workflows = data.workflows || [];
                
                document.getElementById('deployedCount').textContent = workflows.length;
                document.getElementById('activeCount').textContent = workflows.filter(w => w.active).length;

                const listEl = document.getElementById('workflowList');
                if (workflows.length === 0) {
                    listEl.innerHTML = '<p style="color: var(--text-secondary);">No workflows deployed yet. Save your settings first, then click "Redeploy All".</p>';
                    return;
                }

                listEl.innerHTML = workflows.map(w => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color);">
                        <div>
                            <strong style="color: var(--text-primary);">${w.name}</strong>
                            <small style="color: var(--text-secondary); display: block;">ID: ${w.id}</small>
                        </div>
                        <button class="btn-${w.active ? 'success' : 'secondary'}" style="padding: 5px 10px; font-size: 0.85rem;" onclick="toggleWorkflow('${w.id}', ${!w.active})">
                            <i class="fas fa-${w.active ? 'pause' : 'play'}"></i> ${w.active ? 'Active' : 'Paused'}
                        </button>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('workflowList').innerHTML = '<p style="color: var(--accent-red);">Failed to load workflows</p>';
            }
        }

        async function toggleWorkflow(workflowId, active) {
            try {
                await apiRequest(`/control-panel/workflows/${workflowId}/toggle`, 'POST', { active });
                await loadWorkflows();
            } catch (error) {
                showWorkflowAlert('error', 'Failed to toggle workflow: ' + error.message);
            }
        }

        async function testN8nConnection() {
            try {
                showWorkflowAlert('info', '<i class="fas fa-spinner fa-spin"></i> Testing connection...');
                const data = await apiRequest('/control-panel/workflows/test-connection');
                showWorkflowAlert('success', `<i class="fas fa-check"></i> Connected! Found ${data.workflowCount} workflows in n8n.`);
            } catch (error) {
                showWorkflowAlert('error', '<i class="fas fa-times"></i> Connection failed: ' + error.message);
            }
        }

        async function redeployAllWorkflows() {
            if (!confirm('This will redeploy all workflows with your current settings. Continue?')) return;

            const progressEl = document.getElementById('redeployProgress');
            const progressFill = document.getElementById('redeployProgressFill');
            const progressText = document.getElementById('redeployProgressText');
            
            progressEl.style.display = 'block';
            progressFill.style.width = '10%';
            progressText.textContent = 'Starting redeployment...';

            try {
                progressFill.style.width = '30%';
                progressText.textContent = 'Redeploying workflows...';

                const data = await apiRequest('/control-panel/workflows/redeploy', 'POST', {});
                
                progressFill.style.width = '100%';
                progressText.textContent = `Completed: ${data.successful}/${data.successful + data.failed} successful`;
                
                showWorkflowAlert('success', `<i class="fas fa-check"></i> Redeployed ${data.successful} workflows successfully!`);
                await loadWorkflows();
                
                setTimeout(() => { progressEl.style.display = 'none'; }, 3000);
            } catch (error) {
                progressEl.style.display = 'none';
                showWorkflowAlert('error', '<i class="fas fa-times"></i> Redeployment failed: ' + error.message);
            }
        }

        function showWorkflowAlert(type, message) {
            const alertEl = document.getElementById('workflowAlert');
            alertEl.className = `alert alert-${type === 'success' ? 'success' : type === 'error' ? 'error' : 'info'}`;
            alertEl.innerHTML = message;
            alertEl.style.display = 'flex';
            if (type === 'success') {
                setTimeout(() => { alertEl.style.display = 'none'; }, 5000);
            }
        }

        init();
    </script>
</body>
</html>
